<!doctype html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HRM Ҳисоботи 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE || document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');</script>
<style>
  :root{
    --bg:#0b1020; --ink:#f4f6fb; --muted:#a9b3c9; --line:rgba(255,255,255,.12);
    --accent:#ff8a3d; --sky:#9aaecb; --hot:#ff6b7a;
    --ease:cubic-bezier(.65,0,.35,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased}
  body{display:grid;place-items:center;height:100dvh;width:100vw}
  .stage{position:relative;width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;overflow:hidden;container-type:size;
    background:#0d1326;box-shadow:0 30px 80px rgba(0,0,0,.45);touch-action:pan-y}
  @supports not (height:100dvh){body{height:100vh}.stage{width:min(100vw,calc(100vh*16/9))}}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  .stage.nogl{background:linear-gradient(180deg,#141a30 0%,#1b2236 62%,#2a3245 74%,#161c2a 74.6%,#0f1420 100%)}
  .stage.nogl::after{content:"";position:absolute;left:0;right:0;top:76%;height:1.6cqh;
    background:repeating-linear-gradient(90deg,#58627c 0 1.2cqw,transparent 1.2cqw 4cqw);animation:slide 2s linear infinite}
  @keyframes slide{to{background-position:4cqw 0}}

  /* ---------- report panel (only the report data, over the factory) ---------- */
  .panel{--k:1;--u:calc(var(--k)*1cqw);position:absolute;left:2.2cqw;right:2.2cqw;top:2.4cqh;bottom:29.5cqh;
    display:flex;flex-direction:column;gap:calc(var(--u)*.6);overflow:hidden;font-size:calc(var(--u)*.9);line-height:1.25;
    transition:opacity .35s var(--ease),transform .35s var(--ease)}
  .panel.out{opacity:0;transform:translateY(1.4cqh)}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:calc(var(--u)*1.2)}
  .head .step{display:inline-flex;align-items:center;gap:.6em;font-size:calc(var(--u)*.78);font-weight:700;letter-spacing:.18em;color:var(--accent)}
  .head .step::before{content:"";width:calc(var(--u)*2);height:2px;background:currentColor;border-radius:2px}
  .head h1{font-size:calc(var(--u)*2.05);line-height:1.08;font-weight:800;letter-spacing:-.015em;margin-top:calc(var(--u)*.25);text-shadow:0 2px 14px rgba(0,0,0,.5)}
  .head h1.long{font-size:calc(var(--u)*1.55)}
  .head .sub{font-size:calc(var(--u)*1);color:#c9d3e6;margin-top:calc(var(--u)*.2);text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .badge{display:flex;align-items:center;gap:calc(var(--u)*.8);padding:calc(var(--u)*.5) calc(var(--u)*1);border-radius:calc(var(--u)*.8);
    background:rgba(8,13,27,.7);border:1px solid var(--line);border-left:4px solid var(--hot);flex:none}
  .badge b{font-size:calc(var(--u)*2.6);font-weight:800}
  .badge span{font-size:calc(var(--u)*.85);font-weight:700;line-height:1.15}
  .badge em{display:block;font-style:normal;font-weight:400;color:var(--muted);font-size:calc(var(--u)*.75)}
  .body{flex:1;min-height:0;display:grid;gap:calc(var(--u)*.6);align-content:stretch}
  .col{display:flex;flex-direction:column;gap:calc(var(--u)*.6);min-width:0;min-height:0}

  .card{background:rgba(8,13,27,.68);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);border:1px solid var(--line);
    border-radius:calc(var(--u)*.75);padding:calc(var(--u)*.7) calc(var(--u)*.9);display:flex;flex-direction:column;gap:calc(var(--u)*.45);min-width:0}
  .card.grow{flex:1}
  .card h3{font-size:calc(var(--u)*.9);font-weight:700;color:#eef2fa;line-height:1.2}
  .card h3 small{font-weight:400;color:var(--muted);font-size:.9em}
  .cap{font-size:calc(var(--u)*.7);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .muted{color:var(--muted)}
  .note{font-size:calc(var(--u)*.72);color:var(--muted);line-height:1.3}
  .txt{font-size:calc(var(--u)*.82);color:#dbe2ee;line-height:1.35}
  .txt b{color:#fff}

  .kpis{display:grid;grid-template-columns:repeat(var(--c,4),minmax(0,1fr));gap:calc(var(--u)*.5)}
  .kpi{background:rgba(8,13,27,.7);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);border:1px solid var(--line);
    border-radius:calc(var(--u)*.7);padding:calc(var(--u)*.55) calc(var(--u)*.8);display:flex;flex-direction:column;gap:calc(var(--u)*.12);min-width:0}
  .kpi .l{font-size:calc(var(--u)*.62);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .kpi b{font-size:calc(var(--u)*1.7);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
  .kpi b small{font-size:.5em;font-weight:600;color:var(--muted);margin-left:.25em}
  .kpi .s{font-size:calc(var(--u)*.7);color:#cdd6e6;line-height:1.25}
  .kpi.acc{background:color-mix(in srgb,var(--accent) 26%,rgba(8,13,27,.75));border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
  .kpi.hot b{color:var(--hot)}
  .kpi.hotb{border-color:rgba(255,107,122,.7)}

  /* horizontal bars */
  .hb{display:grid;grid-template-columns:minmax(0,max-content) minmax(calc(var(--u)*4),1fr) max-content;column-gap:calc(var(--u)*.5);
    row-gap:calc(var(--u)*.26);align-items:center;font-size:calc(var(--u)*.72)}
  .hb .l{text-align:right;color:#d3dbea;max-width:calc(var(--u)*15);line-height:1.15}
  .hb .t{display:block;height:calc(var(--u)*.78);background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
  .hb .f{display:block;height:100%;width:var(--w);background:var(--sky);border-radius:3px;transform-origin:left;transform:scaleX(0);
    transition:transform .8s var(--ease) calc(var(--i)*35ms)}
  .hb .f.hi{background:var(--accent)} .hb .f.hot{background:var(--hot)}
  .hb .v{font-weight:700;font-variant-numeric:tabular-nums}
  .in .hb .f{transform:none}

  /* vertical bars */
  .vb{display:flex;gap:calc(var(--u)*.3);flex:1;min-height:calc(var(--u)*var(--vh,6.5));align-items:stretch;padding-top:calc(var(--u)*1)}
  .vb .c{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
  .vb .bs{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;border-bottom:1px solid rgba(255,255,255,.15)}
  .vb .b{position:relative;flex:1;max-width:calc(var(--u)*2.4);height:var(--h);min-height:1px;background:var(--sky);border-radius:3px 3px 0 0;
    transform-origin:bottom;transform:scaleY(0);transition:transform .8s var(--ease) calc(var(--i)*30ms)}
  .vb .b.s2{background:var(--accent)} .vb .b.hi{background:var(--accent)} .vb .b.hot{background:var(--hot)}
  .vb .b i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:calc(var(--u)*.6);font-weight:700;
    white-space:nowrap;padding-bottom:1px;color:#e8edf6}
  .vb .x{font-size:calc(var(--u)*.6);color:var(--muted);margin-top:calc(var(--u)*.2);white-space:nowrap;line-height:1.1;text-align:center}
  .vb.rot .x{writing-mode:vertical-rl;transform:rotate(180deg)}
  .in .vb .b{transform:none}
  .lg{display:flex;gap:calc(var(--u)*.9);font-size:calc(var(--u)*.66);color:var(--muted)}
  .lg i{display:inline-block;width:.8em;height:.8em;border-radius:2px;margin-right:.35em;vertical-align:-.05em;background:var(--sky)}
  .lg i.s2{background:var(--accent)}

  /* line chart */
  .ln{width:100%;height:auto;display:block;overflow:visible}
  .ln polyline{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;transition:stroke-dashoffset 1.2s var(--ease)}
  .in .ln polyline{stroke-dashoffset:0}
  .ln circle{fill:#0b1020;stroke:var(--accent);stroke-width:2}
  .ln text{fill:#dfe6f2;font-size:10px;font-weight:700;text-anchor:middle}
  .ln text.x{fill:#a9b3c9;font-weight:400}

  /* tables */
  .tb{width:100%;border-collapse:collapse;font-size:calc(var(--u)*.7);font-variant-numeric:tabular-nums}
  .tb th{background:color-mix(in srgb,var(--accent) 30%,rgba(20,28,48,.9));color:#fff;text-align:left;font-weight:700;padding:calc(var(--u)*.26) calc(var(--u)*.45)}
  .tb td{padding:calc(var(--u)*.2) calc(var(--u)*.45);border-bottom:1px solid rgba(255,255,255,.07);color:#dde4ef;vertical-align:top}
  .tb .r{text-align:right;white-space:nowrap}
  .tb tr.tot td{font-weight:800;color:#fff;background:rgba(255,255,255,.07)}
  .tb td.hot,.tb tr.hot td{color:var(--hot);font-weight:700}
  .tb td.grp{font-weight:700;color:#fff;background:rgba(255,255,255,.04)}

  /* lists */
  .ls{list-style:none;display:flex;flex-direction:column;gap:calc(var(--u)*.35)}
  .ls li{display:flex;gap:calc(var(--u)*.55);align-items:flex-start;font-size:calc(var(--u)*.78);line-height:1.28}
  .ls li .n{flex:none;width:calc(var(--u)*1.45);height:calc(var(--u)*1.45);border-radius:50%;display:grid;place-items:center;
    background:color-mix(in srgb,var(--accent) 35%,transparent);color:#fff;font-weight:800;font-size:calc(var(--u)*.68)}
  .ls li b{color:#fff}
  .ls li .d{display:block;color:var(--muted);font-size:.92em}
  .rows{display:flex;flex-direction:column;gap:calc(var(--u)*.18);font-size:calc(var(--u)*.74)}
  .rows div{display:flex;justify-content:space-between;gap:1em;border-bottom:1px dashed rgba(255,255,255,.08);padding-bottom:2px}
  .rows div b{font-variant-numeric:tabular-nums}
  .rows .more{color:var(--muted);font-style:italic;border:0}

  .grid{display:grid;gap:calc(var(--u)*.5)}
  .ph{display:grid;gap:calc(var(--u)*.5)}
  .ph figure{display:flex;flex-direction:column;gap:calc(var(--u)*.25);min-width:0}
  .ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:calc(var(--u)*.5);display:block}
  .ph figcaption{font-size:calc(var(--u)*.68);color:#d6deeb;line-height:1.2}
  .ph figcaption b{color:var(--accent)}

  /* hero (title + section dividers) */
  .hero{align-self:center;justify-self:start;width:min(100%,calc(var(--u)*46));padding:calc(var(--u)*1.8) calc(var(--u)*2.2);gap:calc(var(--u)*.6)}
  .hero .num{font-size:calc(var(--u)*4.4);font-weight:900;line-height:.9;color:var(--accent);letter-spacing:-.03em}
  .hero h2{font-size:calc(var(--u)*2.8);font-weight:800;line-height:1.05;letter-spacing:-.02em}
  .hero p{font-size:calc(var(--u)*1.15);color:#cfd8e8}
  .hero .rule{height:3px;width:calc(var(--u)*8);background:var(--accent);border-radius:3px}
  .logo{background:#fff;border-radius:calc(var(--u)*.6);padding:calc(var(--u)*.5) calc(var(--u)*.9);align-self:flex-start}
  .logo img{height:calc(var(--u)*2.6);display:block}

  .stair{display:flex;flex-direction:column;gap:calc(var(--u)*.35)}
  .stair div{border-radius:calc(var(--u)*.45);padding:calc(var(--u)*.4) calc(var(--u)*.7);background:rgba(154,174,203,.18);font-size:calc(var(--u)*.8)}
  .stair div b{display:block;font-size:1.15em}
  .stair div span{color:var(--muted);font-size:.85em}
  .flow{font-size:calc(var(--u)*.85);line-height:1.5;color:#e6ecf5}
  .tag{display:inline-block;font-size:calc(var(--u)*.62);font-weight:800;letter-spacing:.1em;padding:.25em .7em;border-radius:999px;
    background:color-mix(in srgb,var(--accent) 80%,#000 0%);color:#0b1020}
  .doc{display:flex;justify-content:center;align-items:center;min-height:0}
  .doc img{max-height:100%;max-width:100%;border-radius:calc(var(--u)*.4);box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff}

  /* ---------- controls ---------- */
  .nav{position:absolute;left:50%;bottom:2.2cqh;transform:translateX(-50%);display:flex;align-items:center;gap:1cqw;
    padding:.5cqw .7cqw;border-radius:999px;background:rgba(8,12,26,.78);border:1px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .nav button{appearance:none;border:0;cursor:pointer;color:var(--ink);background:transparent;font:inherit}
  .arrow{width:2.7cqw;height:2.7cqw;min-width:30px;min-height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);transition:background .25s,transform .25s}
  .arrow:hover{background:rgba(255,255,255,.18)} .arrow:active{transform:scale(.94)}
  .arrow[disabled]{opacity:.35;cursor:default}
  .arrow svg{width:46%;height:46%}
  .dots{display:flex;align-items:center;gap:.15cqw}
  .dots button{width:1.15cqw;height:1.8cqw;min-width:8px;min-height:18px;display:grid;place-items:center;border-radius:4px}
  .dots button i{width:.42cqw;height:.42cqw;min-width:4px;min-height:4px;border-radius:50%;background:rgba(169,179,201,.5);transition:transform .3s,background .3s}
  .dots button.done i{background:rgba(169,179,201,.95)}
  .dots button[aria-current="true"] i{background:var(--accent);transform:scale(1.9)}
  .count{font-size:max(11px,.95cqw);font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums;min-width:4.4em;text-align:center}
  .nav button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* phones in portrait: full-screen stage, stacked cards, the panel scrolls inside its own area */
  @media (max-aspect-ratio: 4/5){
    .stage{width:100vw;height:100dvh;aspect-ratio:auto}
    .panel{--u:2.5cqw;bottom:31cqh;overflow-y:auto;overscroll-behavior:contain;padding-right:1cqw}
    .body{display:flex!important;flex-direction:column}
    .grid,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}
    .card{overflow-x:auto}
    .card,.col,.kpi,.grid{flex:none!important}
    .vb{min-height:22cqw}
    .hero{width:100%}
    .nav{bottom:2cqh;gap:2cqw;padding:1.4cqw 2cqw;max-width:96cqw}
    .dots{display:none}
    .arrow{width:10cqw;height:10cqw}
    .count{font-size:3.6cqw}
  }
  @media (prefers-reduced-motion: reduce){
    .panel,.hb .f,.vb .b,.ln polyline{transition:none!important}
  }
</style>
</head>
<body>
<main class="stage" id="stage" aria-roledescription="taqdimot" aria-label="HRM Ҳисоботи 2026">

<article class="panel" id="panel" aria-live="polite"></article>

<nav class="nav" aria-label="Слайдлар">
  <button class="arrow" id="prev" type="button" aria-label="Олдинги слайд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
  <div class="dots" id="dots"></div>
  <span class="count" id="count" aria-hidden="true">01 / 29</span>
  <button class="arrow" id="next" type="button" aria-label="Кейинги слайд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
  <button class="arrow" id="fs" type="button" aria-label="Тўлиқ экран"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</nav>
<p class="sr" id="live" aria-live="polite"></p>
</main>

<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= report building blocks ================= */
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const fmt = (v) => String(v).replace('.', ',');
  const card = (title, inner, cls = '', style = '') => `<section class="card ${cls}" style="${style}">${title ? `<h3>${title}</h3>` : ''}${inner}</section>`;
  const kpi = (l, v, s = '', cls = '') => `<div class="kpi ${cls}">${l ? `<span class="l">${l}</span>` : ''}<b>${v}</b>${s ? `<span class="s">${s}</span>` : ''}</div>`;
  const kpis = (arr, c) => `<div class="kpis" style="--c:${c || arr.length}">${arr.join('')}</div>`;
  function hbar(items, o = {}) {
    const max = o.max || Math.max(...items.map((d) => d[1]));
    return `<div class="hb">${items.map((d, i) => `<span class="l">${d[0]}</span><span class="t"><span class="f ${d[2] || ''}" style="--w:${(d[1] / max * 100).toFixed(2)}%;--i:${i}"></span></span><span class="v">${o.f ? o.f(d[1]) : fmt(d[1])}${o.suf || ''}</span>`).join('')}</div>`;
  }
  function vbar(cats, series, o = {}) {
    const max = o.max || Math.max(...series.flatMap((s) => s.v));
    return `<div class="vb ${o.rot ? 'rot' : ''}" style="--vh:${o.h || 6.5}">${cats.map((c, i) => `<div class="c"><div class="bs">${series.map((s, k) => {
      const v = s.v[i]; const cls = (s.cls || '') + ((o.hi || []).includes(i) ? ' hi' : '') + ((o.hot || []).includes(i) ? ' hot' : '');
      return `<span class="b ${cls}" style="--h:${(v / max * 100).toFixed(2)}%;--i:${i}"><i>${o.f ? o.f(v) : fmt(v)}${o.suf || ''}</i></span>`;
    }).join('')}</div><span class="x">${c}</span></div>`).join('')}</div>`;
  }
  const legend = (names) => `<div class="lg">${names.map((n, k) => `<span><i class="${k ? 's2' : ''}"></i>${n}</span>`).join('')}</div>`;
  function line(cats, vals, o = {}) {
    const W = 400, H = o.H || 130, pl = 14, pr = 14, pt = 18, pb = 22;
    const mn = o.min ?? Math.min(...vals), mx = o.max ?? Math.max(...vals);
    const X = (i) => pl + (W - pl - pr) * i / (cats.length - 1), Y = (v) => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn || 1));
    const pts = vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    return `<svg class="ln" viewBox="0 0 ${W} ${H}" aria-hidden="true"><line x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}" stroke="rgba(255,255,255,.15)"/>
      <polyline points="${pts}"/>${vals.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="3.4"/><text x="${X(i)}" y="${Y(v) - 7}">${o.f ? o.f(v) : fmt(v)}</text><text class="x" x="${X(i)}" y="${H - 6}">${cats[i]}</text>`).join('')}</svg>`;
  }
  function table(head, rows, o = {}) {
    const r = o.r || [];
    return `<table class="tb"><thead><tr>${head.map((h, i) => `<th class="${r.includes(i) ? 'r' : ''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map((row, ri) => {
      const cls = (o.tot && ri === rows.length - 1 ? 'tot' : '') + ((o.hotRows || []).includes(ri) ? ' hot' : '');
      return `<tr class="${cls}">${row.map((c, i) => {
        if (c === null) return '';
        if (typeof c === 'object') return `<td class="${c.cls || ''} ${r.includes(i) ? 'r' : ''}" ${c.rs ? `rowspan="${c.rs}"` : ''}>${c.t}</td>`;
        return `<td class="${r.includes(i) ? 'r' : ''}">${c}</td>`;
      }).join('')}</tr>`;
    }).join('')}</tbody></table>`;
  }
  const list = (items) => `<ul class="ls">${items.map((it, i) => `<li><span class="n">${it.n || i + 1}</span><span>${it.t}${it.d ? `<span class="d">${it.d}</span>` : ''}</span></li>`).join('')}</ul>`;
  const rows = (arr, more) => `<div class="rows">${arr.map((r) => `<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}${more ? `<div class="more">${more}</div>` : ''}</div>`;
  const grid = (cols, inner, extra = '') => `<div class="grid" style="grid-template-columns:${cols};${extra}">${inner}</div>`;
  const cols = (spec, inner, rowsSpec) => ({ spec, inner, rowsSpec });

      const mat = new T.ShaderMaterial({

        fragmentShader: 'uniform vec3 uColor;varying float vA;void main(){float d=length(gl_PointCoord-0.5);float a=smoothstep(0.5,0.0,d)*vA;if(a<0.01)discard;gl_FragColor=vec4(uColor,a);}',
        transparent: true, depthWrite: false, blending: additive ? T.AdditiveBlending : T.NormalBlending });

    [[0, 0.2, 0.7, 3.2, 0.1, 0.12], [0, 0.2, -0.7, 3.2, 0.1, 0.12], [1.3, 0.2, 0, 0.12, 0.1, 1.5], [-1.3, 0.2, 0, 0.12, 0.1, 1.5]].forEach(([x, y, z, w, h, d]) => { const m = new T.Mesh(new T.BoxGeometry(w, h, d), skidM); m.position.set(x, y, z); skid.add(m); });
    [[1.3, 0.7], [1.3, -0.7], [-1.3, 0.7], [-1.3, -0.7]].forEach(([x, z]) => { const m = new T.Mesh(new T.BoxGeometry(0.1, 0.3, 0.1), skidM); m.position.set(x, 0.0, z); skid.add(m); });

    const cMetal = new T.Color(0x9aa3ad), cPrimer = new T.Color(0xb9c1cc), cWhite = new T.Color(0xf3f5f8), tmpC = new T.Color();
    const setOp = (m, o) => { m.opacity = o; const t = o < 0.999; if (m.transparent !== t) { m.transparent = t; m.needsUpdate = true; } m.depthWrite = !t || o > 0.9; m.visible = o > 0.003; };

    // ---------- frame update ----------
    let camX = S.carX, last = performance.now();
    const look = new T.Vector3();
    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      const shift = portrait() ? 0.36 : 0.29;
      camera.setViewOffset(w, h, 0, -h * shift, w, h);
      camera.updateProjectionMatrix();
      const ps = h * renderer.getPixelRatio() / 900 * 300;
      [sparks, mist, smoke, ambient].forEach((p) => { p.mat.uniforms.uScale.value = ps; });
    }
    resize();
    new ResizeObserver(resize).observe(stage);

    tick = function (now) {
      const raw = Math.max(0, (now - last) / 1000), dt = Math.min(0.05, raw); last = now;
      const t = now / 1000, k = reduce ? 0.12 : 1;
      if (S.moving) { const q = clamp((now - S.t0) / (S.dur * 1000)); S.carX = S.from + (S.to - S.from) * easeInOut(q); if (q >= 1) { S.moving = false; S.arrived = t; } }
      const x = S.carX, { w, p, a } = progress(x), busy = S.moving || t - S.arrived < 2.2;
      const zone = x < 40 ? 0 : x < 80 ? 1 : 2;

      // car pose + build state
      car.position.set(x, lerp(0.56, 0.38, clamp((a - 0.25) / 0.1)), 0);
      setOp(bodyMat, lerp(0.18, 1, clamp(w)));
      edgeMat.opacity = clamp(1 - p * 3) * lerp(0.9, 0.35, w); edgeMat.visible = edgeMat.opacity > 0.01;
      setOp(seamM, clamp((w - 0.45) / 0.35) * 0.9);
      if (p < 0.45) tmpC.copy(cMetal).lerp(cPrimer, clamp(p / 0.45)); else tmpC.copy(cPrimer).lerp(cWhite, clamp((p - 0.45) / 0.55));
      bodyMat.color.copy(tmpC);
      bodyMat.metalness = lerp(0.75, 0.05, clamp(p / 0.45)); bodyMat.roughness = p < 0.45 ? lerp(0.38, 0.7, p / 0.45) : lerp(0.7, 0.22, (p - 0.45) / 0.55);
      bodyMat.clearcoat = clamp((p - 0.45) / 0.55);
      const wa = clamp(a / 0.3), drop = (1 - bounce(wa)) * 1.6;
      wheelMats.forEach((m) => setOp(m, clamp(a * 8)));
      wheels.forEach((wh) => { wh.holder.position.y = 0.36 + drop; wh.spin.rotation.z = -(x - 86) / 0.36; });
      setOp(skidM, 1 - clamp((a - 0.25) / 0.1));
      setOp(glassMat, clamp((a - 0.3) / 0.22));
      setOp(trimMat, clamp((a - 0.5) / 0.2)); setOp(chromeMat, clamp((a - 0.5) / 0.2));
      const la = clamp((a - 0.72) / 0.15); setOp(headM, la); setOp(tailM, la); headM.emissiveIntensity = la * 2.2; tailM.emissiveIntensity = la * 1.6;
      setOp(beamM, clamp((a - 0.88) / 0.12) * 0.12);

      // camera follows the car, framed in the lower part of the screen
      camX += (x - camX) * (1 - Math.exp(-raw * 4));
      const aspect = camera.aspect, hf = 2 * Math.atan(Math.tan(T.MathUtils.degToRad(17)) * aspect);
      const D = Math.max(17, 4.2 / Math.tan(hf / 2));
      const sway = Math.sin(t * 0.12) * 0.6 * k;
      camera.position.set(camX + 7 + sway, 3.0, D);
      look.set(camX + 0.6, 1.0, 0); camera.lookAt(look);
      sun.position.set(camX + 6, 14, 9); sun.target.position.set(camX, 0, 0);

      // conveyor slats + overhead hooks
      const off = (t * 0.7 * k) % SLAT_GAP;
      for (let i = 0; i < SLATS; i++) { dummy.position.set(-20 + i * SLAT_GAP + off, 0.37, 0); dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); slats.setMatrixAt(i, dummy.matrix); }
      slats.instanceMatrix.needsUpdate = true;
      const hoff = (t * 1.2 * k) % 2;
      for (let i = 0; i < HOOKS; i++) { dummy.position.set(-25 + i * 2 + hoff, 7.15, -6); dummy.rotation.set(0, 0, Math.sin(t * 2 + i) * 0.08 * k); dummy.updateMatrix(); hooks.setMatrixAt(i, dummy.matrix); }
      hooks.instanceMatrix.needsUpdate = true;

      // machinery
      gears.forEach((g) => { g.g.rotation.z = t * g.sp * k; });
      fans.forEach((f, i) => { f.rotation.z = t * (3 + i) * k; });
      presses.forEach((pr, i) => { const s = Math.max(0, Math.sin(t * 1.4 * k + i * 2.1)) ** 4; pr.ram.position.y = -s * 1.6; pr.lamp.material.emissiveIntensity = s > 0.5 ? 3 : 0.6; });
      let tipActive = null;
      robots.forEach((r) => {
        const near = r.zone === zone && Math.abs(r.x - x) < 3.2 && busy;
        const sp = near ? 2.6 : 0.7, amp = near ? 1 : 0.45, ph = t * sp * k + r.phase;
        r.yaw.rotation.y = (near ? clamp((x - r.x) * 0.25, -0.6, 0.6) : 0) + Math.sin(ph * 0.5) * 0.35 * amp * k;
        r.sh.rotation.x = 0.55 + (near ? 0.25 : 0) + Math.sin(ph) * 0.12 * amp * k;
        r.el.rotation.x = 1.05 + Math.sin(ph * 1.3 + 1) * 0.18 * amp * k;
        r.wr.rotation.x = 0.6 + Math.sin(ph * 1.7) * 0.25 * amp * k;
        if (near && !tipActive) tipActive = r;
      });
      // zone-specific process effects
      flash.intensity = 0; sprayM.opacity = 0;
      const tip = new T.Vector3();
      if (tipActive) {
        tipActive.tip.getWorldPosition(tip);
        if (tipActive.zone === 0 && !reduce) {
          for (let n = 0; n < 6; n++) sparks.emit(tip.x, tip.y, tip.z, (Math.random() - 0.5) * 5, Math.random() * 3.5 + 0.5, (Math.random() - 0.5) * 5, 0.4 + Math.random() * 0.5, 10, 3);
          flash.position.copy(tip); flash.intensity = 1.5 + Math.random() * 2.5;
        } else if (tipActive.zone === 1) {
          spray.position.copy(tip); spray.position.y -= 0.55;
          sprayM.opacity = 0.16 + Math.sin(t * 30) * 0.03 * k;
          if (!reduce) for (let n = 0; n < 2; n++) mist.emit(tip.x + (Math.random() - 0.5) * 0.6, tip.y - 0.8, tip.z + Math.random() * 0.8, (Math.random() - 0.5) * 0.7, -0.2 + Math.random() * 0.3, (Math.random() - 0.5) * 0.5, 1.4, 16, 55);
        } else if (tipActive.zone === 2 && !reduce && Math.random() < 0.3) {
          sparks.emit(tip.x, tip.y, tip.z, (Math.random() - 0.5) * 1.5, Math.random() * 1.5, (Math.random() - 0.5) * 1.5, 0.25, 6, 2);
        }
      }
      if (!reduce && Math.random() < 0.35) ambient.emit(22 + (Math.random() - 0.5) * 2, 2.6, -8.6, (Math.random() - 0.5) * 3, Math.random() * 2.5, Math.random() * 1.5, 0.6, 8, 2);
      // assembly hoist + inspection tunnel
      const tx = 90 + ((Math.sin(t * 0.25 * k) + 1) / 2) * 20;
      trolley.position.x = tx; const drop2 = 2.2 + Math.sin(t * 0.9 * k) * 0.8;
      cable.scale.y = drop2; cable.position.y = 6.2 - drop2 / 2; hookTyre.position.y = 6.2 - drop2 - 0.35;
      tunnelM.emissiveIntensity = a > 0.99 ? 1.4 + Math.sin(t * 3) * 0.3 * k : 0.3;
      zoneLights.forEach((l, i) => { l.intensity = (i === zone ? 1.6 : 0.9) + (i === 0 ? Math.random() * 0.3 * k : 0); });
      // exhaust once the car is complete enough to run
      if (!reduce && a > 0.4) {
        const rate = S.moving ? 3 : 1;
        for (let n = 0; n < rate; n++) if (Math.random() < 0.5) smoke.emit(x - 2.15, car.position.y + 0.02, 0.5 + (Math.random() - 0.5) * 0.08, -0.6 - Math.random() * 0.5, 0.25 + Math.random() * 0.2, (Math.random() - 0.5) * 0.2, 1.8, 18, 90);
      }
      sparks.step(dt, 9.8, 0.6); mist.step(dt, 0, 0.8); smoke.step(dt, -0.05, 0.6); ambient.step(dt, 9.8, 0.4);
      renderer.render(scene, camera);
      window.__dbg = { cx: camera.position.x, carX: car.position.x, camX, D };
    };
    return true;
  }

  if (!init3D()) stage.classList.add('nogl');
  function loop(now) {
    if (tick) tick(now);
    else if (S.moving) { const q = clamp((now - S.t0) / (S.dur * 1000)); S.carX = S.from + (S.to - S.from) * easeInOut(q); if (q >= 1) S.moving = false; }
    requestAnimationFrame(loop);
  }

  /* ================= panel rendering + fit-to-slide ================= */
  const panel = $('panel');
  function fit() {
    let k = 1; panel.style.setProperty('--k', k);
    if (portrait()) return;
    const over = () => panel.scrollHeight > panel.clientHeight + 1 || panel.scrollWidth > panel.clientWidth + 1;
    while (over() && k > 0.5) { k -= 0.025; panel.style.setProperty('--k', k.toFixed(3)); }
  }
  function fill(i) {
    const s = SLIDES[i];
    const head = s.hero ? '' : `<header class="head"><div><div class="step">${String(i + 1).padStart(2, '0')} / ${N}</div><h1 class="${s.long ? 'long' : ''}">${s.t}</h1>${s.s ? `<p class="sub">${s.s}</p>` : ''}</div>${s.badge || ''}</header>`;
    panel.innerHTML = `${head}<div class="body" style="${s.layout || (s.hero ? 'align-content:center' : '')}">${s.body()}</div>`;
    fit();
  }

  const dots = $('dots');
  SLIDES.forEach((s, i) => { const b = document.createElement('button'); b.type = 'button'; b.innerHTML = '<i aria-hidden="true"></i>';
    b.setAttribute('aria-label', `${i + 1}-слайд: ${s.t}`); b.addEventListener('click', () => go(i)); dots.appendChild(b); });
  const dotEls = [...dots.children];

  let swapTimer = 0;
  function go(i) {
    i = clamp(i, 0, N - 1);
    if (i === S.cur) return;
    S.cur = i;
    document.documentElement.style.setProperty('--accent', ACCENT[bayOf(i)]);
    dotEls.forEach((b, k) => { b.setAttribute('aria-current', k === i ? 'true' : 'false'); b.classList.toggle('done', k < i); });
    $('prev').disabled = i === 0; $('next').disabled = i === N - 1;
    $('count').textContent = `${String(i + 1).padStart(2, '0')} / ${N}`;
    $('live').textContent = `${i + 1}-слайд, ${N} тадан: ${SLIDES[i].t}`;
    clearTimeout(swapTimer);
    panel.classList.remove('in');
    const swap = () => { fill(i); panel.classList.remove('out'); requestAnimationFrame(() => requestAnimationFrame(() => panel.classList.add('in'))); };
    if (reduce || !panel.innerHTML) swap(); else { panel.classList.add('out'); swapTimer = setTimeout(swap, 300); }
    S.from = S.carX; S.to = stopX(i); S.t0 = performance.now();
    S.dur = reduce ? 0.001 : clamp(0.9 + Math.abs(S.to - S.from) / 27.5 * 1.1, 1.0, 3.4);
    S.moving = true;
  }

  $('prev').addEventListener('click', () => go(S.cur - 1));
  $('next').addEventListener('click', () => go(S.cur + 1));
  $('fs').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); });
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(S.cur + 1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(S.cur - 1); }
    else if (e.key === 'Home') go(0); else if (e.key === 'End') go(N - 1);
    else if (e.key === 'f' || e.key === 'F') $('fs').click();
  });
  let sx = null, sy = null;
  stage.addEventListener('pointerdown', (e) => { if (e.target.closest('.nav')) return; sx = e.clientX; sy = e.clientY; });
  stage.addEventListener('pointerup', (e) => { if (sx === null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) go(S.cur + (dx < 0 ? 1 : -1)); });
  let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(fit, 120); });

  go(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
