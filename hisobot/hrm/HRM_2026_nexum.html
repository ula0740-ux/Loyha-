<!doctype html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HRM Ҳисоботи 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#ffffff; --muted:rgba(255,255,255,.62); --line:rgba(255,255,255,.14);
    --glass:rgba(255,255,255,.10); --accent:#ffffff; --sky:rgba(255,255,255,.34); --hot:#ff7a7a;
    --cta:linear-gradient(to bottom,#2B2B2B,#101010);
    --ease:cubic-bezier(.16,1,.3,1);
    --sans:'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --pixel:'Silkscreen','Geist','Inter',cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#050608;color:var(--ink);overflow:hidden;font-family:var(--sans);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  button{font:inherit;color:inherit}

  /* ---------- full-bleed stage ---------- */
  .stage{position:relative;height:100vh;height:100dvh;width:100%;overflow:hidden;container-type:size}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .6s ease;pointer-events:none}
  .stage.data .scrim{opacity:1}
  .shell{position:relative;z-index:10;display:flex;flex-direction:column;height:100%}

  /* ---------- top bar ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px}
  @media (min-width:640px){.top{padding:24px 32px}}
  @media (min-width:1024px){.top{padding:24px 48px}}
  .brand{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-size:18px;font-weight:600;white-space:nowrap}
  .brand svg{fill:#fff;flex:none}
  .navr{display:none;align-items:center;gap:12px}
  @media (min-width:768px){.navr{display:flex}}
  .pill{display:flex;align-items:center;gap:4px;border-radius:999px;background:var(--glass);padding:6px;
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
  .pill button{border:0;cursor:pointer;background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;
    color:rgba(255,255,255,.8);transition:background-color .15s,color .15s;display:flex;align-items:center;gap:4px}
  .pill button:hover,.pill button[aria-current="true"]{background:rgba(255,255,255,.10);color:#fff}
  .cta{border:0;cursor:pointer;border-radius:999px;background:var(--cta);color:#fff;font-size:14px;font-weight:500;padding:0 20px;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s;align-self:stretch}
  .cta:hover{opacity:.9}
  .cta svg{width:16px;height:16px}
  .count{font-family:var(--pixel);font-size:13px;letter-spacing:-.02em;padding:0 10px;color:#fff;white-space:nowrap}

  /* mobile menu */
  .burger{position:relative;z-index:50;width:40px;height:40px;border-radius:999px;border:0;cursor:pointer;background:var(--glass);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);display:grid;place-items:center}
  @media (min-width:768px){.burger{display:none}}
  .burger svg{position:absolute;width:20px;height:20px;transition:all .3s}
  .burger .i-x{transform:rotate(-90deg) scale(0);opacity:0}
  .open .burger .i-menu{transform:rotate(90deg) scale(0);opacity:0}
  .open .burger .i-x{transform:none;opacity:1}
  .veil{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    opacity:0;pointer-events:none;transition:opacity .3s}
  .open .veil{opacity:1;pointer-events:auto}
  .drawer{position:fixed;right:0;top:0;z-index:40;height:100%;width:288px;max-width:86vw;background:rgba(0,0,0,.9);
    -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);transform:translateX(100%);transition:transform .5s var(--ease);
    display:flex;flex-direction:column}
  .open .drawer{transform:none}
  .drawer .links{display:flex;flex-direction:column;gap:8px;padding:96px 24px 0;overflow-y:auto}
  .drawer .links button{border:0;cursor:pointer;text-align:left;background:transparent;border-radius:12px;padding:14px 16px;font-size:16px;
    font-weight:500;color:rgba(255,255,255,.8);display:flex;gap:12px;align-items:baseline;
    opacity:0;transform:translateX(24px);transition:opacity .4s ease,transform .4s ease,background-color .15s,color .15s}
  .drawer .links button:hover{background:rgba(255,255,255,.10);color:#fff}
  .drawer .links button span{font-family:var(--pixel);font-size:12px;color:rgba(255,255,255,.5)}
  .open .drawer .links button{opacity:1;transform:none}
  .drawer .foot{margin-top:auto;padding:24px 24px 40px;opacity:0;transform:translateY(16px);transition:opacity .4s ease .3s,transform .4s ease .3s}
  .open .drawer .foot{opacity:1;transform:none}
  .drawer .foot .cta{width:100%;padding:12px 24px}

  /* ---------- slide area ---------- */
  .slide{flex:1;min-height:0;position:relative;padding:0 20px 96px}
  @media (min-width:640px){.slide{padding:0 32px 100px}}
  @media (min-width:1024px){.slide{padding:0 48px 104px}}
  .panel{--k:1;--u:calc(var(--k)*1cqw);height:100%;display:flex;flex-direction:column;gap:calc(var(--u)*.6);overflow:hidden;
    font-size:calc(var(--u)*.9);line-height:1.3;transition:opacity .45s var(--ease),transform .45s var(--ease)}
  .panel.out{opacity:0;transform:translateY(14px)}

  /* bottom controls */
  .ctrl{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 20px 24px}
  .ctrl .pill{padding:6px}
  .round{width:40px;height:40px;border-radius:999px;border:0;cursor:pointer;background:var(--glass);-webkit-backdrop-filter:blur(16px);
    backdrop-filter:blur(16px);display:grid;place-items:center;transition:background-color .15s,opacity .15s;color:#fff}
  .round:hover{background:rgba(255,255,255,.2)} .round[disabled]{opacity:.35;cursor:default}
  .round svg{width:18px;height:18px}
  .dots{display:flex;align-items:center;gap:2px;padding:0 6px}
  .dots button{width:14px;height:24px;border:0;cursor:pointer;background:transparent;display:grid;place-items:center;padding:0}
  .dots button i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35);transition:transform .3s,background .3s}
  .dots button.done i{background:rgba(255,255,255,.7)}
  .dots button[aria-current="true"] i{background:#fff;transform:scale(1.8)}
  @media (max-width:767px){.dots{display:none}}
  .mcount{padding:10px 6px}
  @media (min-width:768px){.mcount{display:none}}
  .stage.open .ctrl{opacity:0;pointer-events:none}
  .ctrl{transition:opacity .3s}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- slide header ---------- */
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:calc(var(--u)*1.2)}
  .head .step{font-family:var(--pixel);font-size:calc(var(--u)*.8);color:rgba(255,255,255,.7);letter-spacing:-.02em}
  .head h1{font-size:calc(var(--u)*2.15);line-height:1.1;font-weight:600;letter-spacing:-.025em;margin-top:calc(var(--u)*.25)}
  .head h1.long{font-size:calc(var(--u)*1.6)}
  .head .sub{font-size:calc(var(--u)*1);color:rgba(255,255,255,.72);margin-top:calc(var(--u)*.25)}
  .badge{display:flex;align-items:center;gap:calc(var(--u)*.8);padding:calc(var(--u)*.6) calc(var(--u)*1.1);border-radius:calc(var(--u)*1.1);
    background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);flex:none}
  .badge b{font-family:var(--pixel);font-weight:400;font-size:calc(var(--u)*2.6);letter-spacing:-.03em}
  .badge span{font-size:calc(var(--u)*.85);font-weight:600;line-height:1.15}
  .badge em{display:block;font-style:normal;font-weight:400;color:var(--muted);font-size:calc(var(--u)*.75)}
  .body{flex:1;min-height:0;display:grid;gap:calc(var(--u)*.6);align-content:stretch}
  .col{display:flex;flex-direction:column;gap:calc(var(--u)*.6);min-width:0;min-height:0}

  /* ---------- glass cards ---------- */
  .card{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:calc(var(--u)*1.1);
    padding:calc(var(--u)*.85) calc(var(--u)*1);display:flex;flex-direction:column;gap:calc(var(--u)*.45);min-width:0}
  .card.grow{flex:1}
  .card h3{font-size:calc(var(--u)*.9);font-weight:600;line-height:1.2}
  .card h3 small{font-weight:400;color:var(--muted);font-size:.9em}
  .cap{font-size:calc(var(--u)*.68);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7)}
  .note{font-size:calc(var(--u)*.72);color:var(--muted);line-height:1.35}
  .txt{font-size:calc(var(--u)*.82);color:rgba(255,255,255,.82);line-height:1.4}
  .txt b{color:#fff}

  .kpis{display:grid;grid-template-columns:repeat(var(--c,4),minmax(0,1fr));gap:calc(var(--u)*.5)}
  .kpi{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:calc(var(--u)*1);
    padding:calc(var(--u)*.65) calc(var(--u)*.9);display:flex;flex-direction:column;gap:calc(var(--u)*.2);min-width:0}
  .kpi .l{font-size:calc(var(--u)*.6);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .kpi b{font-family:var(--pixel);font-size:calc(var(--u)*1.75);font-weight:400;line-height:1.1;letter-spacing:-.03em;white-space:nowrap}
  .kpi b small{font-family:var(--sans);font-size:.48em;font-weight:500;color:var(--muted);margin-left:.3em;letter-spacing:0}
  .kpi .s{font-size:calc(var(--u)*.7);color:rgba(255,255,255,.72);line-height:1.3}
  .kpi.acc{background:rgba(255,255,255,.18)}
  .kpi.hot b{color:var(--hot)}
  .kpi.hotb{box-shadow:inset 0 0 0 1px rgba(255,122,122,.55)}

  .hb{display:grid;grid-template-columns:minmax(0,max-content) minmax(calc(var(--u)*4),1fr) max-content;column-gap:calc(var(--u)*.5);
    row-gap:calc(var(--u)*.28);align-items:center;font-size:calc(var(--u)*.72)}
  .hb .l{text-align:right;color:rgba(255,255,255,.8);max-width:calc(var(--u)*15);line-height:1.15}
  .hb .t{display:block;height:calc(var(--u)*.7);background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
  .hb .f{display:block;height:100%;width:var(--w);background:var(--sky);border-radius:999px;transform-origin:left;transform:scaleX(0);
    transition:transform .9s var(--ease) calc(var(--i)*40ms)}
  .hb .f.hi{background:#fff} .hb .f.hot{background:var(--hot)}
  .hb .v{font-weight:600;font-variant-numeric:tabular-nums}
  .in .hb .f{transform:none}

  .vb{display:flex;gap:calc(var(--u)*.3);flex:1;min-height:calc(var(--u)*var(--vh,6.5));align-items:stretch;padding-top:calc(var(--u)*1)}
  .vb .c{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
  .vb .bs{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;border-bottom:1px solid rgba(255,255,255,.18)}
  .vb .b{position:relative;flex:1;max-width:calc(var(--u)*2.4);height:var(--h);min-height:1px;background:var(--sky);border-radius:4px 4px 0 0;
    transform-origin:bottom;transform:scaleY(0);transition:transform .9s var(--ease) calc(var(--i)*35ms)}
  .vb .b.s2,.vb .b.hi{background:#fff} .vb .b.hot{background:var(--hot)}
  .vb .b i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:calc(var(--u)*.6);font-weight:600;
    white-space:nowrap;padding-bottom:1px}
  .vb .x{font-size:calc(var(--u)*.6);color:var(--muted);margin-top:calc(var(--u)*.2);white-space:nowrap;line-height:1.1;text-align:center}
  .vb.rot .x{writing-mode:vertical-rl;transform:rotate(180deg)}
  .in .vb .b{transform:none}
  .lg{display:flex;gap:calc(var(--u)*.9);font-size:calc(var(--u)*.66);color:var(--muted)}
  .lg i{display:inline-block;width:.8em;height:.8em;border-radius:2px;margin-right:.35em;vertical-align:-.05em;background:var(--sky)}
  .lg i.s2{background:#fff}

  .ln{width:100%;height:auto;display:block;overflow:visible}
  .ln polyline{fill:none;stroke:#fff;stroke-width:2.2;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;transition:stroke-dashoffset 1.3s var(--ease)}
  .in .ln polyline{stroke-dashoffset:0}
  .ln circle{fill:#111;stroke:#fff;stroke-width:2}
  .ln text{fill:#fff;font-size:10px;font-weight:600;text-anchor:middle;font-family:var(--sans)}
  .ln text.x{fill:rgba(255,255,255,.6);font-weight:400}

  .tb{width:100%;border-collapse:collapse;font-size:calc(var(--u)*.7);font-variant-numeric:tabular-nums}
  .tb th{background:rgba(255,255,255,.12);text-align:left;font-weight:600;padding:calc(var(--u)*.28) calc(var(--u)*.45)}
  .tb th:first-child{border-radius:8px 0 0 8px} .tb th:last-child{border-radius:0 8px 8px 0}
  .tb td{padding:calc(var(--u)*.2) calc(var(--u)*.45);border-bottom:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.86);vertical-align:top}
  .tb .r{text-align:right;white-space:nowrap}
  .tb tr.tot td{font-weight:700;color:#fff;background:rgba(255,255,255,.08)}
  .tb td.hot,.tb tr.hot td{color:var(--hot);font-weight:600}
  .tb td.grp{font-weight:600;color:#fff;background:rgba(255,255,255,.05)}

  .ls{list-style:none;display:flex;flex-direction:column;gap:calc(var(--u)*.38)}
  .ls li{display:flex;gap:calc(var(--u)*.55);align-items:flex-start;font-size:calc(var(--u)*.78);line-height:1.3}
  .ls li .n{flex:none;width:calc(var(--u)*1.45);height:calc(var(--u)*1.45);border-radius:6px;display:grid;place-items:center;
    background:#000;color:#fff;font-weight:700;font-size:calc(var(--u)*.68)}
  .ls li b{color:#fff}
  .ls li .d{display:block;color:var(--muted);font-size:.92em}
  .rows{display:flex;flex-direction:column;gap:calc(var(--u)*.2);font-size:calc(var(--u)*.74)}
  .rows div{display:flex;justify-content:space-between;gap:1em;border-bottom:1px dashed rgba(255,255,255,.12);padding-bottom:2px}
  .rows div b{font-variant-numeric:tabular-nums}
  .rows .more{color:var(--muted);font-style:italic;border:0}
  .grid{display:grid;gap:calc(var(--u)*.5)}
  .ph{display:grid;gap:calc(var(--u)*.5)}
  .ph figure{display:flex;flex-direction:column;min-width:0}
  .ph figcaption{font-size:calc(var(--u)*.7);color:rgba(255,255,255,.75);line-height:1.3}
  .ph figcaption b{color:#fff}
  .stair{display:flex;flex-direction:column;gap:calc(var(--u)*.35)}
  .stair div{border-radius:calc(var(--u)*.6);padding:calc(var(--u)*.45) calc(var(--u)*.75);background:rgba(255,255,255,.1);font-size:calc(var(--u)*.8)}
  .stair div b{display:block;font-size:1.15em}
  .stair div span{color:var(--muted);font-size:.85em}
  .flow{font-size:calc(var(--u)*.85);line-height:1.55;color:rgba(255,255,255,.9)}
  .tag{display:inline-block;font-family:var(--sans);font-size:calc(var(--u)*.62);font-weight:600;letter-spacing:.06em;padding:.3em .8em;border-radius:999px;
    background:var(--cta);color:#fff;vertical-align:middle}
  .doc{display:flex;justify-content:center;align-items:center;min-height:0}

  /* ---------- hero slides: bottom-anchored like the landing hero ---------- */
  .hx{margin-top:auto;display:flex;flex-direction:column;gap:calc(var(--u)*1.4)}
  @media (min-width:1024px){.hx{flex-direction:row;align-items:flex-end;justify-content:space-between}}
  .hx h2{font-size:clamp(30px,calc(var(--u)*3.9),64px);font-weight:600;line-height:1.1;letter-spacing:-.025em;max-width:16em}
  .hx h2 span{display:block;font-weight:400}
  .hx p{margin-top:calc(var(--u)*1.1);font-size:clamp(14px,calc(var(--u)*1.1),19px);color:rgba(255,255,255,.75);max-width:34em}
  .hx .card{width:auto;min-width:min(100%,256px);padding:clamp(20px,calc(var(--u)*1.6),28px);gap:clamp(12px,calc(var(--u)*1),18px)}
  .hx .sk{font-family:var(--pixel);font-size:clamp(30px,calc(var(--u)*2.6),40px);font-weight:400;letter-spacing:-.03em;line-height:1}
  .hx .card p{margin:0;font-size:14px;color:rgba(255,255,255,.7);line-height:1.6;max-width:16em}
  .stage.hero .panel{justify-content:flex-end}

  /* ---------- phones in portrait: stacked cards, the panel scrolls ---------- */
  @media (max-aspect-ratio:4/5){
    .panel{--u:2.6cqw;overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
    .body{display:flex!important;flex-direction:column}
    .grid,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}
    .card{overflow-x:auto}
    .card,.col,.kpi,.grid{flex:none!important}
    .vb{min-height:22cqw}
    .hx h2{font-size:30px}
  }
  @media (prefers-reduced-motion:reduce){
    .panel,.hb .f,.vb .b,.ln polyline,.drawer,.drawer .links button,.drawer .foot,.veil,.scrim{transition:none!important}
  }
</style>
</head>
<body>
<section class="stage" id="stage" aria-roledescription="taqdimot" aria-label="HRM Ҳисоботи 2026">
  <video class="bg" autoplay loop muted playsinline aria-hidden="true"
    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260803_192301_9231ed6b-c55c-4a48-909c-4ebe11cf2e11.mp4"></video>
  <div class="scrim"></div>

  <div class="shell">
    <header class="top">
      <a class="brand" href="#" id="home" aria-label="HRM Ҳисоботи 2026">
        <svg width="24" height="24" viewBox="0 0 256 256" aria-hidden="true"><path d="M 128 128 C 128 198.692 70.692 256 0 256 C 0 185.308 57.308 128 128 128 Z M 128 128 C 198.692 128 256 185.308 256 256 C 185.308 256 128 198.692 128 128 Z M 0 0 C 70.692 0 128 57.308 128 128 C 57.308 128 0 70.692 0 0 Z M 256 0 C 256 70.692 198.692 128 128 128 C 128 57.308 185.308 0 256 0 Z"/></svg>
        <span>HRM 2026</span>
      </a>
      <div class="navr">
        <nav class="pill" id="secNav" aria-label="Бўлимлар"></nav>
        <div class="pill"><span class="count" id="count" aria-hidden="true">01 / 29</span></div>
        <button class="cta" id="fs" type="button" aria-label="Тўлиқ экран">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>
      <button class="burger" id="burger" type="button" aria-label="Menyu" aria-expanded="false">
        <svg class="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg class="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>

    <div class="veil" id="veil"></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="links" id="drawerLinks"></div>
      <div class="foot"><button class="cta" id="fs2" type="button" aria-label="Тўлиқ экран">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg> <span class="count" id="count2">01 / 29</span>
      </button></div>
    </aside>

    <main class="slide"><article class="panel" id="panel" aria-live="polite"></article></main>
  </div>

  <div class="ctrl">
    <button class="round" id="prev" type="button" aria-label="Олдинги слайд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
    <div class="pill dots" id="dots" role="group" aria-label="Слайдлар"></div>
    <div class="pill mcount"><span class="count" id="count3" aria-hidden="true">01 / 29</span></div>

      `<div class="doc"><svg viewBox="0 0 200 270" style="height:100%;max-width:100%" aria-hidden="true"><rect x="8" y="8" width="184" height="254" rx="6" fill="#f4f6fb"/><rect x="8" y="8" width="184" height="254" rx="6" fill="none" stroke="var(--accent)" stroke-width="3"/><line x1="100" y1="22" x2="100" y2="210" stroke="#c9d1de" stroke-width="2"/><g stroke="#9aa6b8" stroke-width="5" stroke-linecap="round">${[30, 42, 54, 66, 100, 112, 124, 136, 170, 182].map((y) => `<line x1="20" y1="${y}" x2="88" y2="${y}"/><line x1="112" y1="${y}" x2="180" y2="${y}"/>`).join('')}</g><circle cx="150" cy="215" r="22" fill="none" stroke="#3b6fd8" stroke-width="3" opacity=".7"/><path d="M118 214 q14 -16 26 0 t26 0" fill="none" stroke="#2a4a9a" stroke-width="2.5"/></svg></div>` },

  // sections exactly as listed on the contents slide (slide 2)
  const SECTIONS = [['01', 'Ишга қабул ва адаптация', 2], ['02', 'Самарадорлик ва KPI', 10], ['03', 'Ўқитишлар', 14], ['04', 'Grading тизими', 17],
    ['05', 'Электрон ариза тизими', 20], ['06', 'Корпоратив маданият ва коммуникациялар', 24], ['07', 'Интизом бўйича', 26]];
  const sectionOf = (i) => { let s = -1; SECTIONS.forEach((x, k) => { if (i >= x[2]) s = k; }); return s; };
