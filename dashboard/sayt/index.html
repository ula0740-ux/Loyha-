<!DOCTYPE html>
<html lang="uz">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#0c1a2b;--muted:#6b7a8c;--line:#e1e6ec;--soft:#f3f5f8;--road:#1d2a3a;
--ok:#12a36b;--ok-s:#d9f3e7;--bad:#e5483a;--bad-s:#fde3df;--warn:#b87500;--warn-s:#fff1d6;
--c630:#2f63ff;--c700:#14b8a6;--ckd:#2f63ff;--ckd-s:#e3eaff;--skd:#8b5cf6;--skd-s:#efe8ff;
--disp:"Archivo","Arial Black",sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
[hidden]{display:none!important}
#panel{display:grid;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2.5px solid var(--c630);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.wrap{max-width:1600px;margin:0 auto;padding:24px 28px 40px;display:grid;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.lft{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.logo{font:900 28px/1 var(--disp);font-stretch:125%;display:flex;align-items:center;gap:12px}
.logo i{width:36px;height:36px;border-radius:10px;background:var(--ink);display:grid;place-items:center;color:#fff;font:900 12px var(--disp);font-style:normal}
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:5px}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:12px;font-weight:800;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff}
.seg{display:flex;background:#e6eaf0;border-radius:999px;padding:4px}
.seg button{border:0;background:none;padding:8px 15px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.b{background:var(--c630);color:#fff;border-color:var(--c630)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border-radius:22px;padding:22px;min-width:0}
.ct{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ct h2{margin:0;font:800 20px var(--disp);font-stretch:115%}.ct span{color:var(--muted);font-size:13px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:12px}
.chip{display:inline-block;font:800 14px var(--disp);font-stretch:110%;border-radius:999px;padding:4px 11px}
.chip.ok{background:var(--ok-s);color:var(--ok)}.chip.bad{background:var(--bad-s);color:var(--bad)}.chip.nil{background:var(--soft);color:var(--muted)}
.code{font:900 12px var(--disp);color:#fff;border-radius:6px;padding:3px 7px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:50;max-width:90vw}
.toast.err{background:var(--bad)}
.loading{padding:40px;text-align:center;color:var(--muted);font-weight:700}
/* score */
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.sc{display:grid;gap:14px;align-content:start}
.sc.dark{background:var(--road);color:#fff}
.when{display:flex;justify-content:space-between;align-items:center;gap:8px}
.when b{font:900 21px var(--disp);font-stretch:120%;text-transform:uppercase}
.when span{font-weight:700;font-size:13px;color:var(--muted)}.dark .when span{color:#9fb0c4}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ev{display:grid;gap:6px;min-width:0}
.ev .lab{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--muted)}.dark .ev .lab{color:#9fb0c4}
.ev .n{font:900 54px/.95 var(--disp);font-stretch:115%;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.dark .ev .n{font-size:44px;font-stretch:106%}
.ev .chip{justify-self:start}
.dark .chip.ok{background:rgba(74,222,154,.16);color:#4ade9a}.dark .chip.bad{background:rgba(255,138,125,.16);color:#ff8a7d}.dark .chip.nil{background:#26354a;color:#9fb0c4}
.trk{position:relative;height:40px}
.trk .lane{position:absolute;left:0;right:0;top:14px;height:14px;border-radius:7px;background:#eef1f5}.dark .trk .lane{background:#2b3a4d}
.trk .fill{position:absolute;left:0;top:14px;height:14px;border-radius:7px;background:linear-gradient(90deg,#2f63ff,#5b86ff)}
.trk .mk{position:absolute;top:4px;width:2px;height:34px;background:var(--ink)}.dark .trk .mk{background:#fff}
.trk .mk span{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font:700 11px var(--body);white-space:nowrap;color:var(--muted)}.dark .trk .mk span{color:#cfd8e3}
.trk svg{position:absolute;top:6px;width:34px;height:28px;transform:translateX(-60%)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--muted);flex-wrap:wrap}.dark .meta{color:#9fb0c4}.meta b{color:var(--ink)}.dark .meta b{color:#fff}
.mq{display:flex;align-items:center;gap:12px;background:var(--bad-s);border-radius:14px;padding:9px 14px}.dark .mq{background:rgba(255,138,125,.12)}
.mq b{font:900 28px/1 var(--disp);font-stretch:115%;color:var(--bad)}.dark .mq b{color:#ff8a7d}
.mq span{font-size:13px;font-weight:700;color:var(--bad)}.dark .mq span{color:#ffb3aa}
.mq em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}.dark .mq em{color:#cfd8e3}
/* calendar */
.mid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.calnav{display:flex;align-items:center;gap:6px}
.calnav button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.wd{font-weight:700;font-size:12px;color:var(--muted);text-align:center}
.day{position:relative;border-radius:13px;padding:8px 10px;min-height:70px;display:grid;align-content:space-between;background:var(--soft);border:2px solid transparent;text-align:left}
.day .d{font-weight:700;font-size:12px;color:var(--muted)}.day .v{font:800 20px var(--disp);font-stretch:110%}.day .p{font-weight:700;font-size:11px}
.day .q{position:absolute;top:7px;right:8px;min-width:22px;height:22px;border-radius:11px;background:var(--bad);color:#fff;font:800 11px/22px var(--body);text-align:center;padding:0 6px}
.day.ok{background:var(--ok-s)}.day.ok .p{color:var(--ok)}.day.bad{background:var(--bad-s)}.day.bad .p{color:var(--bad)}
.day.off{background:transparent;border:2px dashed var(--line)}.day.fut .v{color:#c3ccd6}
.day.sel{border-color:var(--ink);box-shadow:0 6px 16px rgba(12,26,43,.14)}
.day.today .d::after{content:" · bugun";color:var(--c630)}
.leg{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;font-weight:600;color:var(--muted)}.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.det{display:grid;gap:14px;align-content:start}
.sp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sp div{border-radius:14px;padding:12px 14px;background:var(--soft)}
.sp b{font:900 28px var(--disp);font-stretch:115%;display:block}.sp span{font-size:12px;font-weight:700;color:var(--muted)}
.bars{display:grid;gap:9px}
.br{display:grid;grid-template-columns:minmax(80px,140px) 1fr 54px;gap:10px;align-items:center;font-weight:700;font-size:14px}
.br>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .b{height:12px;border-radius:6px;background:#eef1f5;overflow:hidden;display:flex}.br .b i{height:100%}
.br em{font:800 17px var(--disp);font-stretch:110%;font-style:normal;text-align:right}
hr{border:0;border-top:1px solid var(--line);margin:2px 0}
.sub{font:800 15px var(--disp);font-stretch:112%;display:flex;justify-content:space-between;gap:8px}.sub span{font:600 12px var(--body);color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t td,table.t th{padding:7px 6px;border-top:1px solid var(--line);text-align:left;font-weight:600}
table.t th{font:700 11px var(--body);color:var(--muted);letter-spacing:.05em;text-transform:uppercase;border-top:0}
.tag{font:800 10px var(--body);letter-spacing:.08em;border-radius:6px;padding:3px 7px;color:#fff}
/* year */
.yr{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px}
.mo{border-radius:14px;padding:10px;background:var(--soft);display:grid;gap:3px;border:2px solid transparent;text-align:left}
.mo .d{font-weight:800;font-size:12px;color:var(--muted)}.mo .v{font:800 18px var(--disp);font-stretch:108%}.mo .p{font-weight:700;font-size:11px}.mo .qq{font-weight:700;font-size:11px;color:var(--bad)}
.mo.ok{background:var(--ok-s)}.mo.ok .p{color:var(--ok)}.mo.bad{background:var(--bad-s)}.mo.bad .p{color:var(--bad)}.mo.cur{border-color:var(--ink)}.mo.fut .v{color:#c3ccd6}
/* mqs */
.sect{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.sect h2{margin:0;font:900 25px var(--disp);font-stretch:118%}
.k3,.r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.mbig{font:900 66px/.9 var(--disp);font-stretch:118%;letter-spacing:-.02em}
.split{display:flex;height:20px;border-radius:10px;overflow:hidden;margin:14px 0 8px;background:var(--soft)}.split i{display:block;height:100%}
.legend2{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px;flex-wrap:wrap}
.cat{border-radius:22px;padding:22px;display:grid;gap:12px;align-content:start}
.cat.cp{background:var(--ckd-s)}.cat.ct2{background:var(--warn-s)}
.cat h3{margin:0;font:800 21px var(--disp);font-stretch:115%;display:flex;justify-content:space-between;align-items:baseline;gap:8px}.cat h3 small{font:700 13px var(--body);color:var(--muted)}
.cat .n{font:900 54px/.9 var(--disp);font-stretch:118%}
.topl{display:grid;gap:9px}
.tr{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:11px 14px;font-weight:700}
.tr .rk{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:900 16px var(--disp);color:#fff}
.tr em{font:900 23px var(--disp);font-stretch:112%;font-style:normal}.tr small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.card .tr{background:var(--soft)}
.range{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{padding:22px;border:2px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted);font-weight:700}
/* admin */
.lay{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.side{background:var(--card);border-radius:22px;padding:12px;display:grid;gap:4px}
.side button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-weight:700;color:var(--muted);border:0;background:none;text-align:left}
.side button.on{background:var(--ink);color:#fff}
.side .note{font-size:12px;color:var(--muted);padding:8px 12px;font-weight:600}
.amain{display:grid;gap:18px}
.form{display:grid;gap:12px}
.f{display:grid;gap:6px}.f label{font:700 12px var(--body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pl{border-radius:18px;padding:16px;display:grid;gap:10px}.pl.c{background:var(--ckd-s)}.pl.s{background:var(--skd-s)}.pl.t{background:var(--soft)}
.pl .h{display:flex;justify-content:space-between;font-weight:800}.pl .h span{color:var(--muted);font-size:12px}
.pl input{font:800 28px var(--disp);font-stretch:112%;background:#fff;width:100%}
.pl .r{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted)}.pl .r b{color:var(--ink)}
.sch{display:grid;grid-template-columns:100px repeat(31,minmax(0,1fr));gap:4px;align-items:stretch}
.sch .hd{font:700 11px var(--body);color:var(--muted);text-align:center;display:grid}.sch .hd b{font:800 13px var(--disp);color:var(--ink)}.sch .hd.we b{color:var(--bad)}
.sch .rl{display:flex;flex-direction:column;justify-content:center;font-weight:800;font-size:14px}.sch .rl span{font:600 11px var(--body);color:var(--muted)}
.cell{height:48px;border-radius:9px;display:grid;place-items:center;font:900 15px var(--disp);border:0}
.cell.s2{background:#12a36b;color:#fff}.cell.s1{background:#cfe7da;color:#0d6b47}.cell.sQ{background:var(--warn-s);color:var(--warn)}
.cell.sX{background:var(--bad-s);color:var(--bad)}.cell.sD{background:#fff;border:1.5px dashed #cfd6df;color:#a7b2bf}
.drop{border:2px dashed #c5cfdb;border-radius:18px;padding:22px;text-align:center;font-weight:700;color:var(--muted);display:grid;gap:6px;cursor:pointer}
.drop.over{border-color:var(--c630);background:#eef3ff}.drop b{color:var(--ink);font-size:16px}
.pv{display:grid;gap:10px;background:var(--soft);border-radius:16px;padding:14px}
.pv .h{display:flex;justify-content:space-between;gap:10px;font-weight:800;flex-wrap:wrap}
.pv .row input,.pv .row select{background:#fff}
.ok-t{color:var(--ok);font-weight:800}.bad-t{color:var(--bad);font-weight:800}
.ed{width:90px;text-align:right;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.login{max-width:440px;margin:40px auto}
@media (max-width:1100px){.score,.k3,.r3,.mid,.two,.plans{grid-template-columns:minmax(0,1fr)}.yr{grid-template-columns:repeat(6,minmax(0,1fr))}.lay{grid-template-columns:minmax(0,1fr)}.sch{overflow-x:auto;grid-template-columns:100px repeat(31,40px)}}

/* ---- glassy navigatsiya: sirpanuvchi yorug' tomchi ---- */
.gl{position:relative;isolation:isolate}
.tabs.gl,.seg.gl{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);box-shadow:0 8px 30px rgba(12,26,43,.08),inset 0 1px 0 rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
.side.gl{background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.gl>button{position:relative;z-index:2;transition:color .35s ease}
.gl>button.on{background:transparent!important}
.glider{position:absolute;z-index:1;left:0;top:0;border-radius:12px;pointer-events:none;
  background:linear-gradient(180deg,#1d3150,#0c1a2b);
  box-shadow:0 0 0 1px rgba(91,134,255,.35),0 6px 18px rgba(47,99,255,.35),inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .55s cubic-bezier(.34,1.56,.64,1),width .55s cubic-bezier(.34,1.56,.64,1),height .4s ease}
.seg .glider{border-radius:999px}
.glider::before{content:"";position:absolute;left:50%;top:-7px;width:28px;height:7px;transform:translateX(-50%);border-radius:7px 7px 0 0;background:#5b86ff;box-shadow:0 0 14px 4px rgba(91,134,255,.75)}
.glider::after{content:"";position:absolute;left:50%;top:100%;width:70%;height:22px;transform:translateX(-50%);background:radial-gradient(50% 100% at 50% 0,rgba(91,134,255,.55),transparent);filter:blur(4px)}
.side .glider::before{left:-6px;top:50%;width:6px;height:26px;transform:translateY(-50%);border-radius:6px 0 0 6px}
.side .glider::after{display:none}
.glider.pop{animation:glPop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes glPop{0%{filter:brightness(1)}35%{filter:brightness(1.35)}100%{filter:brightness(1)}}
/* sahifa almashinuvi */
.enter{animation:enterUp .5s cubic-bezier(.22,1,.36,1) both}
.enter>*{animation:enterUp .55s cubic-bezier(.22,1,.36,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}
@keyframes enterUp{from{opacity:0;transform:translateY(14px) scale(.99);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.card,.cat{transition:transform .25s ease,box-shadow .25s ease}
.card:hover{box-shadow:0 10px 30px rgba(12,26,43,.07)}
.day,.mo{transition:transform .2s ease,box-shadow .2s ease}
.day:hover,.mo:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(12,26,43,.10)}
@media (prefers-reduced-motion:reduce){.glider,.glider.pop,.enter,.enter>*,.day,.mo{transition:none!important;animation:none!important}}

/* ---- shaffof shisha fon (Admin Dashboard V2 uslubi) ---- */
:root{--card:rgba(255,255,255,.62);--soft:rgba(255,255,255,.55);--line:rgba(255,255,255,.7);--bg:#cfe3ee}
html,body{background:#cfe3ee}
body::before{content:"";position:fixed;inset:-10%;z-index:-2;
  background:radial-gradient(40% 45% at 15% 20%,#7fc4d8 0,transparent 70%),radial-gradient(45% 50% at 85% 15%,#5b86ff 0,transparent 70%),
  radial-gradient(50% 55% at 70% 85%,#2fb7a8 0,transparent 70%),radial-gradient(40% 40% at 20% 90%,#a9c9ff 0,transparent 70%),linear-gradient(135deg,#dbeef5,#b9d4ea);
  filter:blur(40px) saturate(120%);animation:bgDrift 28s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:rgba(255,255,255,.18)}
@keyframes bgDrift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-3%,2%,0) scale(1.06)}}
.card,.side,.cat,.tabs,.seg{-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
.card,.side{background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 40px rgba(20,60,90,.10),inset 0 1px 0 rgba(255,255,255,.9)}
.sc.dark{background:rgba(16,34,56,.78);border-color:rgba(255,255,255,.12)}
.cat.cp{background:rgba(227,234,255,.72);border:1px solid rgba(255,255,255,.7)}.cat.ct2{background:rgba(255,241,214,.75);border:1px solid rgba(255,255,255,.7)}
.day,.mo,.sp div,.pl,.pv,.mq{background-color:rgba(255,255,255,.5)}
.day.ok,.mo.ok{background:rgba(217,243,231,.85)}.day.bad,.mo.bad{background:rgba(253,227,223,.85)}.mq{background:rgba(253,227,223,.8)}
.day.off{background:transparent;border-color:rgba(255,255,255,.8)}
.tr,.card .tr{background:rgba(255,255,255,.75)}
input,select{background:rgba(255,255,255,.7)}
.trk .lane,.br .b{background:rgba(255,255,255,.65)}
/* sahifa almashinuvi: eski sahifa muzli shishaga aylanib eriydi, yangisi tiniqlashib chiqadi */
.leave{animation:frostOut .28s ease-in both;pointer-events:none}
@keyframes frostOut{to{opacity:0;filter:blur(14px) saturate(140%);transform:scale(.985)}}
.enter>*{animation:frostIn .6s cubic-bezier(.22,1,.36,1) both}
@keyframes frostIn{0%{opacity:0;filter:blur(16px);transform:translateY(18px) scale(.97)}60%{opacity:1}100%{opacity:1;filter:none;transform:none}}
.enter .card,.enter .cat{animation:frostIn .65s cubic-bezier(.22,1,.36,1) both}
.enter .score>*:nth-child(1),.enter .k3>*:nth-child(1),.enter .r3>*:nth-child(1){animation-delay:.04s}
.enter .score>*:nth-child(2),.enter .k3>*:nth-child(2),.enter .r3>*:nth-child(2){animation-delay:.12s}
.enter .score>*:nth-child(3),.enter .k3>*:nth-child(3),.enter .r3>*:nth-child(3){animation-delay:.2s}
.enter .mid>*:nth-child(2){animation-delay:.14s}
.grow .br .b i,.grow .trk .fill,.grow .split i{animation:growX .9s cubic-bezier(.22,1,.36,1) both;transform-origin:left}

/* ---------------- Excel o'qish */
function readBook(file){
  return file.arrayBuffer().then(function(buf){ return XLSX.read(buf, {type:'array', cellDates:true}); });
}
function cellDate(v){
  if (v instanceof Date) return ymd(v) + ' ' + ('0'+v.getHours()).slice(-2) + ':' + ('0'+v.getMinutes()).slice(-2) + ':' + ('0'+v.getSeconds()).slice(-2);
  var s = String(v || '').trim(), m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/))) return m[1] + '-' + m[2] + '-' + m[3] + (m[4] || '');
  if ((m = s.match(/^(\d{2})\.(\d{2})\.(\d{4})(.*)$/))) return m[3] + '-' + m[2] + '-' + m[1] + (m[4] || '');
  return '';
}
function parseFile(file){
  return readBook(file).then(function(wb){
    var ws = wb.Sheets[wb.SheetNames[0]];
    var aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
    var name = file.name;
    var hdrM = aoa.findIndex(function(r){ return r.some(function(c){ return String(c).trim() === 'Fault name'; }); });
    if (hdrM >= 0){
      var H = aoa[hdrM].map(function(c){ return String(c).trim(); }), c = function(n){ return H.indexOf(n); };
      var rows = aoa.slice(hdrM + 1).filter(function(r){ return r[c('Fault name')] || r[c('Vin')]; }).map(function(r){
        var plant = String(r[c('Plant')] || '').toUpperCase().indexOf('CKD') >= 0 ? 'CKD' : 'SKD';
        return [cellDate(r[c('Defect date')]), plant, String(r[c('Model')] || '').trim(), String(r[c('Prod team')] || '').trim(),
                String(r[c('Nuqson nomlari')] || '').trim(), String(r[c('Fault name')] || '').trim(), String(r[c('Level 2')] || '').trim(),
                String(r[c('Vin')] || '').trim(), String(r[c('Defect status')] || '').trim()];
      }).filter(function(r){ return r[0]; });
      return {kind:'mqs', name:name, rows:rows};
    }
    var hi = aoa.findIndex(function(r){ return r.some(function(c){ return String(c).trim() === '№ кузова'; }); });
    if (hi < 0) throw new Error(name + ': fayl tanilmadi ("№ кузова" yoki "Fault name" ustuni topilmadi).');
    var Hd = aoa[hi].map(function(c){ return String(c).trim(); }), ci = function(n){ return Hd.indexOf(n); };
    var mc = ci('Бренд (Модель)'); if (mc >= 0 && Hd[mc+1] === '') mc++;
    var vc = ci('№ кузова'), md = ci('Модификация'), rc = ci('Цвет'), rs = ci('растаможен');
    var title = String((aoa[0] || [])[0] || '');
    var last = Hd.filter(function(x){ return x; }).slice(-1)[0] || '';
    var tur = (name.match(/(^|\D)(630|700)(\D|$)/) || [])[2] || (/630/.test(last) ? '630' : /ЦОП|700/i.test(last) ? '700' : '');
    var sex = /CKD/i.test(title) ? 'CKD' : /SKD/i.test(title) ? 'SKD' : '';
    var dm = name.match(/(\d{2})\.(\d{2})\.(\d{4})/);
    var rows2 = aoa.slice(hi + 1).filter(function(r){ return String(r[vc] || '').trim().length > 5; }).map(function(r){
      return [String(r[vc]).trim(), String(r[mc] || '').trim(), String(r[md] || '').trim(), String(r[rc] || '').trim(), +r[rs] === 1];
    });
    return {kind:'event', name:name, tur:tur, sex:sex || 'SKD', sana: dm ? dm[3] + '-' + dm[2] + '-' + dm[1] : S.data.bugun, rows:rows2};
  });
}

/* ---------------- glassy sirpanuvchi indikator */
function glide(box, animate){
  if (!box) return;
  var g = box.querySelector(':scope>.glider');
  if (!g){ g = document.createElement('span'); g.className = 'glider'; box.prepend(g); animate = false; }
  var on = box.querySelector(':scope>button.on'); if (!on){ g.style.opacity = 0; return; }
  g.style.opacity = 1;
  if (!animate){ g.style.transition = 'none'; }
  g.style.width = on.offsetWidth + 'px'; g.style.height = on.offsetHeight + 'px';
  g.style.transform = 'translate(' + on.offsetLeft + 'px,' + on.offsetTop + 'px)';
  if (!animate){ void g.offsetWidth; g.style.transition = ''; }
  else { g.classList.remove('pop'); void g.offsetWidth; g.classList.add('pop'); }
}
function glideAll(animate){ document.querySelectorAll('.gl').forEach(function(b){ glide(b, animate); }); }
var lastGl = {};
function glideKeep(){ document.querySelectorAll('.gl').forEach(function(b){
  var id = b.id || (b.classList.contains('side') ? 'side' : ''), on = b.querySelector(':scope>button.on');
  var key = on ? on.textContent : ''; var prev = lastGl[id];
  var has = b.querySelector(':scope>.glider');
  if (prev && prev.key !== key && id && has){ glide(b, true); }
  else if (prev && prev.key !== key && id){ var g = document.createElement('span'); g.className = 'glider'; g.style.transition = 'none';
    g.style.width = prev.w + 'px'; g.style.height = prev.h + 'px'; g.style.transform = 'translate(' + prev.x + 'px,' + prev.y + 'px)'; b.prepend(g); void g.offsetWidth; g.style.transition = ''; glide(b, true); }
  else glide(b, false);
  if (on) lastGl[id] = {key:key, w:on.offsetWidth, h:on.offsetHeight, x:on.offsetLeft, y:on.offsetTop};
}); }
window.addEventListener('resize', function(){ glideAll(false); });
var glQ = false; new MutationObserver(function(muts){ if (glQ) return; for (var i = 0; i < muts.length; i++){ var t = muts[i].target; if (t.closest && (t.closest('.gl') || (t.querySelector && t.querySelector('.gl')))){ glQ = true; requestAnimationFrame(function(){ glQ = false; glideKeep(); }); return; } } }).observe(document.body, {subtree:true, childList:true, attributes:true, attributeFilter:['class']});
function countUp(root){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  root.querySelectorAll('.ev .n, .mbig, .cat .n, .sp b').forEach(function(el){
    var txt = el.textContent, num = +txt.replace(/[^\d]/g, ''); if (!num || !/^[\d\s]+$/.test(txt.trim())) return;
    var t0 = performance.now(), dur = 900;
    (function step(t){ var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = f(num * e); if (k < 1) requestAnimationFrame(step); else el.textContent = txt; })(t0);
  });
}
function enter(el){ el.classList.remove('enter', 'grow'); void el.offsetWidth; el.classList.add('enter', 'grow'); countUp(el); setTimeout(function(){ el.classList.remove('grow'); }, 1200); }
function ghost(el){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || el.hidden) return;
  var r = el.getBoundingClientRect(), vh = window.innerHeight; if (r.bottom < 0 || r.top > vh) return;
  var g = el.cloneNode(true); g.removeAttribute('id'); g.querySelectorAll('[id]').forEach(function(x){ x.removeAttribute('id'); });
  g.classList.remove('enter','grow','leave'); g.classList.add('ghost');
  g.style.left = r.left + 'px'; g.style.top = r.top + 'px'; g.style.width = r.width + 'px'; g.style.height = Math.min(r.height, vh - r.top + 40) + 'px'; g.style.overflow = 'hidden';
  document.body.appendChild(g); setTimeout(function(){ g.remove(); }, 650);
}
function swap(el, render){ ghost(el); render(); enter(el); }

/* ---------------- oq / qora mavzu (aylana bo'lib yoyiladi) */
(function(){
  var root = document.documentElement, btn = document.getElementById('themeBtn');
  var saved = null; try { saved = localStorage.getItem('admTheme'); } catch(e){}
  var set = function(t){ root.setAttribute('data-theme', t); btn.textContent = t === 'dark' ? '☀' : '☾'; try { localStorage.setItem('admTheme', t); } catch(e){} };
  set(saved === 'dark' ? 'dark' : 'light');
  btn.onclick = function(){
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches){ set(next); return; }
    var r = btn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    var end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    document.startViewTransition(function(){ set(next); }).ready.then(function(){
      root.animate({ clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + end + 'px at ' + x + 'px ' + y + 'px)'] },
        { duration: 650, easing: 'cubic-bezier(.4,0,.2,1)', pseudoElement: '::view-transition-new(root)' });
    });
  };
})();
/* ---------------- ko'rinish almashinuvi */
function show(v){
  var cur = $(S.view === 'admin' ? 'admin' : 'panel');
  if (S.view !== v) ghost(cur);
  show2(v);
}
function show2(v){
  S.view = v;
  $('panel').hidden = v !== 'panel'; $('admin').hidden = v !== 'admin';
  $('tabPanel').classList.toggle('on', v === 'panel'); $('tabAdmin').classList.toggle('on', v === 'admin');
  $('sexSeg').hidden = v !== 'panel';
  if (v === 'panel') renderPanel(); else renderAdmin();
  enter($(v === 'panel' ? 'panel' : 'admin'));
}
$('tabPanel').onclick = function(){ show('panel'); };
$('tabAdmin').onclick = function(){ show('admin'); };
$('tabAdmin').hidden = !window.SHOW_ADMIN;
document.querySelectorAll('#sexSeg button').forEach(function(b){ b.onclick = function(){ S.sex = b.getAttribute('data-s'); document.querySelectorAll('#sexSeg button').forEach(function(x){ x.classList.toggle('on', x === b); }); swap($('panel'), renderPanel); }; });

run('getData').then(function(d){
  S.data = d; index();
  var past = S.ix.dates.filter(function(x){ return x <= d.bugun; });
  S.sel = past.length ? past[past.length-1] : d.bugun;
  show(window.SHOW_ADMIN && location.hash === '#boshqaruv' ? 'admin' : 'panel');
}).catch(function(e){ $('panel').innerHTML = '<div class="empty">Ma\'lumot o\'qilmadi: ' + esc(e.message) + '</div>'; });
})();
