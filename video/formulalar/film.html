<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Ishlab chiqarish formulalari</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0a1431;
    font-family: Montserrat, sans-serif; color: #fff; }
  #cam { position: absolute; inset: 0; transform-origin: 540px 1000px; }
  .layer { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .glow { color: #3dff7a; text-shadow: 0 0 14px rgba(61,255,122,.8), 0 0 46px rgba(61,255,122,.38); }
  .wglow { text-shadow: 0 0 18px rgba(255,255,255,.35); }
  .c { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
  .panel { position: absolute; border: 2px solid rgba(150,180,255,.42); background: rgba(8,16,42,.72); box-sizing: border-box; }
  .panel::before, .panel::after { content: ''; position: absolute; width: 18px; height: 18px; border: 3px solid #3dff7a; }
  .panel::before { left: -3px; top: -3px; border-right: 0; border-bottom: 0; }
  .panel::after { right: -3px; bottom: -3px; border-left: 0; border-top: 0; }
  .lbl { position: absolute; font: 500 22px "JetBrains Mono"; color: rgba(170,195,255,.7); letter-spacing: .08em; }
  .num { font-variant-numeric: tabular-nums; }
  #caption { position: absolute; left: 70px; width: 940px; top: 250px; font: 700 50px/1.28 Montserrat; z-index: 80; }
  #caption .w { display: inline-block; margin-right: .26em; transition: none; }
</style>
</head>
<body>
<div id="stage"><div id="cam"></div><div id="caption"></div></div>
<script>
// ---------- palette (reference: navy blueprint grid + neon green)
const C = { bg: '#0a1431', grid: 'rgba(130,160,255,.08)', grid2: 'rgba(130,160,255,.17)', g: '#3dff7a', gd: 'rgba(61,255,122,.35)', line: 'rgba(150,180,255,.42)', mute: 'rgba(170,195,255,.55)', white: '#ffffff', red: '#ff4d5e' };
const GLOW = '0 0 14px rgba(61,255,122,.8), 0 0 46px rgba(61,255,122,.38)';

// ---------- math
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const io = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = x => 1 - Math.pow(1 - clamp(x), 3);
const inn = x => Math.pow(clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const sp = (t, f = 2.2, z = .78) => { if (t <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + z * w / wd * Math.sin(wd * t)); };
const fq = t => Math.round(t * 30) / 30;   // frame-snapped time: counters and scrambles never mix two values in one blended frame
const hash = n => { n = Math.sin(n * 127.1) * 43758.5453; return n - Math.floor(n); };
const uz = (n, d = 0) => n.toFixed(d).replace('.', ',');

// ---------- DOM helpers
const cam = document.getElementById('cam');
function el(parent, tag, css = {}, html = '') { const e = document.createElement(tag); Object.assign(e.style, css); if (html) e.innerHTML = html; parent.appendChild(e); return e; }
const svgNS = 'http://www.w3.org/2000/svg';
function svg(parent, w, h, css = {}) { const s = document.createElementNS(svgNS, 'svg'); s.setAttribute('width', w); s.setAttribute('height', h); s.setAttribute('viewBox', `0 0 ${w} ${h}`); Object.assign(s.style, { position: 'absolute', overflow: 'visible' }, css); parent.appendChild(s); return s; }
function sv(parent, tag, attrs) { const e = document.createElementNS(svgNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
let zc = 0;
function layer() { const l = el(cam, 'div'); l.className = 'layer'; l.style.zIndex = ++zc; return l; }
const show = (e, on) => { e.style.visibility = on ? 'inherit' : 'hidden'; };

/** blueprint grid + a drifting green light (each scene layer has its own) */
function bg(L, gx, gy, tilted = false) {
  el(L, 'div', { position: 'absolute', inset: 0, background: 'radial-gradient(ellipse at 50% 55%, #13235a 0%, #0a1431 60%, #060c22 100%)' });
  const persp = el(L, 'div', { position: 'absolute', inset: 0, perspective: '900px', perspectiveOrigin: '50% 40%' });
  const grid = el(persp, 'div', { position: 'absolute', inset: '-216px', backgroundImage:
    `linear-gradient(${C.grid2} 2px, transparent 2px), linear-gradient(90deg, ${C.grid2} 2px, transparent 2px), linear-gradient(${C.grid} 1px, transparent 1px), linear-gradient(90deg, ${C.grid} 1px, transparent 1px)`,
    backgroundSize: '216px 216px, 216px 216px, 54px 54px, 54px 54px' });
  const blob = el(L, 'div', { position: 'absolute', width: '900px', height: '900px', borderRadius: '50%', background: 'radial-gradient(circle, rgba(61,255,122,.32) 0%, rgba(61,255,122,.08) 35%, transparent 65%)' });
  return (t, tilt = 0) => {
    // reference 2.3 s: the grid swings in from a steep 3D tilt and settles flat
    grid.style.transform = `rotateX(${tilt * 62}deg) rotateZ(${tilt * -14}deg) scale(${1 + tilt * .6}) translate(${(t * 6) % 216}px, ${(t * 10) % 216}px)`;
    grid.style.opacity = 1 - tilt * .3;
    blob.style.transform = `translate(${gx - 450 + Math.sin(t * .4) * 120}px, ${gy - 450 + Math.cos(t * .33) * 100}px)`;
  };
}
/** kinetic word pop (reference "В ПОЛНОМ АХУЕ?"): snaps in big, lands with a spring; arrives hot green and
 * cools to white with a soft green halo (keep = stays green). No blur: the reference words are crisp. */
const HOT = '0 0 10px rgba(180,255,200,.95), 0 0 40px rgba(61,255,122,.9), 0 0 90px rgba(61,255,122,.55)';
function pop(e, t, t0, tOut = 1e9, keep = false, from = 1.18) {
  const p = sp(t - t0, 3.0, .55), on = t >= t0;
  e.style.opacity = on ? clamp((t - t0) * 20) : 0;
  e.style.transform = `scale(${from - (from - 1) * p})`;
  const c = keep ? 1 : 1 - seg(t, t0 + .12, t0 + .55);
  e.style.color = keep ? C.g : `rgb(${Math.round(lerp(255, 61, c))},255,${Math.round(lerp(255, 122, c))})`;
  e.style.textShadow = c > .02 ? HOT : '0 0 18px rgba(61,255,122,.45), 0 0 50px rgba(61,255,122,.2)';
  echo(e, t, tOut);
}
/** echo exit (reference 5.0 s / 20.8 s): the text leaves a stack of fading copies as it lifts away */
function echo(e, t, tOut) {
  if (t < tOut) return;
  const k = seg(t, tOut, tOut + .4), d = 26 * out(k);
  e.style.textShadow = [1, 2, 3, 4, 5].map(j => `0 ${-j * d}px 0 rgba(255,255,255,${(.5 - j * .08) * (1 - k)})`).join(',');
  e.style.opacity = (1 - inn(k)) * (+e.style.opacity || 1);
  e.style.transform = (e.style.transform || '') + ` translateY(${-60 * inn(k)}px)`;
}
/** light-pen writing (reference intro "Привет,"): thin letters appear behind a glowing green dot */
function pen(parent, text, css) {
  const box = el(parent, 'div', Object.assign({ position: 'absolute', whiteSpace: 'nowrap', font: '200 72px/1.1 Inter', color: '#fff' }, css));
  const ch = [...text].map(c => { const sEl = el(box, 'span', { display: 'inline-block', whiteSpace: 'pre' }, c === ' ' ? ' ' : c); return sEl; });
  const dot = el(box, 'div', { position: 'absolute', width: '14px', height: '14px', borderRadius: '50%', background: '#eafff0', boxShadow: '0 0 12px 4px rgba(61,255,122,.95), 0 0 70px 30px rgba(61,255,122,.35)', top: '50%', marginTop: '-7px', marginLeft: '-7px' });
  let xs = null;
  return { box, f(t, t0, dur = .8, tOut = 1e9) {
    if (!xs) xs = ch.map(c => c.offsetLeft + c.offsetWidth);
    const k = seg(t, t0, t0 + dur), n = ch.length, pos = k * n;
    ch.forEach((c, j) => { const a = clamp(pos - j); c.style.opacity = a; c.style.textShadow = a < 1 && a > 0 ? HOT : '0 0 14px rgba(61,255,122,.35)'; });
    const j = Math.min(n - 1, Math.floor(pos)), fr = pos - Math.floor(pos);
    const x = lerp(j ? xs[j - 1] : 0, xs[j], k >= 1 ? 1 : fr);
    dot.style.left = x + 'px'; dot.style.opacity = t >= t0 && t < t0 + dur + .25 ? 1 - seg(t, t0 + dur, t0 + dur + .25) : 0;
    dot.style.transform = `translateY(${Math.sin(pos * 2.1) * 10}px)`;
    box.style.visibility = t >= t0 ? 'inherit' : 'hidden';
    box.style.opacity = 1; box.style.transform = '';
    if (t >= tOut) { const q = seg(t, tOut, tOut + .4); box.style.opacity = 1 - inn(q); box.style.transform = `translateY(${-50 * inn(q)}px)`; box.style.filter = `blur(${q * 6}px)`; }
  } };
}
/** section header: index, abbreviation (kinetic pop), English expansion (light pen), Uzbek meaning (pop) */
function header(L, idx, abbr, en, uz) {
  const box = el(L, 'div', { position: 'absolute', left: '70px', top: '540px', width: '940px', height: '380px' });
  const i = el(box, 'div', { position: 'absolute', left: 0, top: 0, font: '600 26px "JetBrains Mono"', color: C.g, letterSpacing: '.2em' }, idx);
  const a = el(box, 'div', { position: 'absolute', left: 0, top: '40px', font: '900 150px/1 Montserrat', letterSpacing: '-.01em', whiteSpace: 'nowrap', transformOrigin: '0 100%' }, abbr);
  const E = pen(box, en, { left: '4px', top: '200px', fontSize: abbr.length > 4 ? '60px' : '70px' });
  const n = el(box, 'div', { position: 'absolute', left: '4px', top: '292px', font: '800 36px Montserrat', letterSpacing: '.06em', whiteSpace: 'nowrap', transformOrigin: '0 50%' }, uz.toUpperCase());
  const rule = el(box, 'div', { position: 'absolute', left: 0, top: '356px', width: '940px', height: '3px', background: C.g, boxShadow: '0 0 12px rgba(61,255,122,.8)', transformOrigin: '0 0' });
  return { box, f(t, tA, tE, tU, tOut = 1e9) {
    i.style.opacity = clamp((t - tA + .2) * 4) * (1 - seg(t, tOut, tOut + .3));
    pop(a, t, tA, tOut);
    E.f(t, tE, .75, tOut);
    pop(n, t, tU, tOut, true, 1.1);
    const r = out(seg(t, tU, tU + .5)) * (1 - seg(t, tOut, tOut + .3));
    rule.style.transform = `scaleX(${r})`; rule.style.opacity = r > 0 ? 1 : 0;
  } };
}
/** decode effect: characters resolve left to right out of random glyphs */
const GL = '01#/<>_=+*%';
function scramble(text, t, t0, dur) {
  if (t < t0) return '';
  const k = seg(t, t0, t0 + dur), n = text.length, done = Math.floor(k * n), f = Math.floor(fq(t) * 30);
  let s = text.slice(0, done);
  for (let j = done; j < Math.min(n, done + 4); j++) s += text[j] === ' ' ? ' ' : GL[Math.floor(hash(j * 13 + f) * GL.length)];
  return s;
}
/** monospace line that decodes in */
function mline(L, text, css) { const e = el(L, 'div', Object.assign({ position: 'absolute', font: '600 48px "JetBrains Mono"', whiteSpace: 'nowrap' }, css)); e.dataset.text = text; return e; }
function mshow(e, t, t0, dur = .6, tOut = 1e9) { e.textContent = scramble(e.dataset.text, t, t0, dur); e.style.opacity = 1 - seg(t, tOut, tOut + .3); }
/** big glowing word that slams in (scale + blur) */
function slam(e, t, t0, tOut = 1e9, from = 1.35) {
  const p = sp(t - t0, 2.6, .62), q = inn(seg(t, tOut, tOut + .3));
  e.style.opacity = t < t0 ? 0 : clamp(p * 2) * (1 - q);
  e.style.transform = `scale(${from - (from - 1) * p - q * .1})`;
  e.style.filter = `blur(${(1 - clamp(p * 1.4)) * 14 + q * 8}px)`;
}
/** wireframe panel whose frame draws open from its centre */
function panel(L, x, y, w, h, label = '') {
  const p = el(L, 'div', { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); p.className = 'panel';
  if (label) { const l = el(p, 'div', { left: '16px', top: '-34px' }, label); l.className = 'lbl'; }
  return { p, f(t, t0, tOut = 1e9) {
    const k = io(seg(t, t0, t0 + .45)), q = io(seg(t, tOut, tOut + .35));
    const ins = (1 - k + q) * 50;
    p.style.clipPath = `inset(${ins}% 0 ${ins}% 0)`; p.style.visibility = k > 0 && q < 1 ? 'inherit' : 'hidden';
  } };
}
/** definition card: green tick bar + text */
function defcard(L, y, text) {
  const d = el(L, 'div', { position: 'absolute', left: '70px', top: y + 'px', width: '900px', padding: '22px 28px 22px 34px', background: 'rgba(61,255,122,.08)', borderLeft: `6px solid ${C.g}`, font: '600 34px/1.35 Montserrat', color: '#e9f0ff' }, text);
  return (t, t0, tOut = 1e9) => { const p = sp(t - t0, 2.2, .85), q = inn(seg(t, tOut, tOut + .3)); d.style.opacity = clamp(p * 1.5) * (1 - q); d.style.transform = `translateX(${(1 - p) * -60}px)`; d.style.clipPath = `inset(0 ${(1 - out(seg(t, t0, t0 + .5))) * 100}% 0 0)`; };
}
const CAR = 'M8 52 L26 50 L48 28 Q54 22 66 22 L118 22 Q128 22 136 30 L156 48 L182 52 Q190 54 190 62 L190 70 L8 70 Z';
function car(parent, x, y, s = 1, color = C.g) {
  const g = svg(parent, 200, 90, { left: x + 'px', top: y + 'px', transformOrigin: '0 0' });
  sv(g, 'path', { d: CAR, fill: 'rgba(61,255,122,.12)', stroke: color, 'stroke-width': 4, 'stroke-linejoin': 'round' });
  sv(g, 'path', { d: 'M56 30 L70 30 L70 48 L42 48 Z M78 30 L116 30 L132 48 L78 48 Z', fill: 'none', stroke: color, 'stroke-width': 3 });
  for (const cx of [50, 150]) { sv(g, 'circle', { cx, cy: 72, r: 15, fill: '#0a1431', stroke: color, 'stroke-width': 4 }); sv(g, 'circle', { cx, cy: 72, r: 4, fill: color }); }
  g.style.filter = 'drop-shadow(0 0 8px rgba(61,255,122,.6))';
  g.style.transform = `scale(${s})`;
  return g;
}

// ---------- timeline + narration (written text for captions)
let TL, S, T, NAR;
const W = (id, i) => S[id].words[i].t;

// =====================================================================================
const groups = [];   // {L, t0, t1, inType}
let scenes = [];
function group(t0key, t1key, inType, word = '') { const L = layer(); const g = { L, k0: t0key, k1: t1key, inType, word }; groups.push(g); return L; }

function build() {
  // ---------------- HOOK + INTRO
  {
    const L = group('hook', 'tt1', 'cut');
    const B = bg(L, 540, 1100, true);
    const hookPen = pen(L, 'Bitta avtomobil', { left: '120px', top: '470px', fontSize: '84px' });
    const bloom = el(L, 'div', { position: 'absolute', inset: 0, background: 'radial-gradient(circle at 50% 70%, rgba(200,255,215,.9), rgba(61,255,122,.35) 45%, transparent 75%)', zIndex: 4, opacity: 0 });
    const dot = el(L, 'div', { position: 'absolute', left: '540px', top: '1100px', width: '40px', height: '40px', marginLeft: '-20px', marginTop: '-20px', borderRadius: '50%', background: C.g, boxShadow: '0 0 30px 10px rgba(61,255,122,.7), 0 0 120px 40px rgba(61,255,122,.3)' });
    const ring = svg(L, 520, 520, { left: '280px', top: '840px' });
    const ticks = [];
    for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2, r1 = i % 5 ? 236 : 220; ticks.push(sv(ring, 'line', { x1: 260 + Math.sin(a) * r1, y1: 260 - Math.cos(a) * r1, x2: 260 + Math.sin(a) * 250, y2: 260 - Math.cos(a) * 250, stroke: C.line, 'stroke-width': i % 5 ? 2 : 4 })); }
    const arc = sv(ring, 'circle', { cx: 260, cy: 260, r: 200, fill: 'none', stroke: C.g, 'stroke-width': 8, 'stroke-dasharray': 1257, 'stroke-dashoffset': 1257, transform: 'rotate(-90 260 260)', 'stroke-linecap': 'round' });
    arc.style.filter = 'drop-shadow(0 0 10px rgba(61,255,122,.8))';
    const necha = el(L, 'div', { position: 'absolute', left: 0, width: '1080px', top: '620px', textAlign: 'center', font: '900 120px/1 Montserrat', color: '#fff', textShadow: '0 0 30px rgba(255,255,255,.35)' }, 'NECHA');
    const soniya = el(L, 'div', { position: 'absolute', left: 0, width: '1080px', top: '1420px', textAlign: 'center', font: '900 150px/1 Montserrat', color: C.g, textShadow: GLOW }, 'SO-NI-YA?');
    const tc = el(L, 'div', { position: 'absolute', left: 0, width: '1080px', top: '1066px', textAlign: 'center', font: '700 64px "JetBrains Mono"', color: '#fff' }); tc.className = 'num';
    // intro: the 7
    const seven = el(L, 'div', { position: 'absolute', left: 0, width: '1080px', top: '600px', textAlign: 'center', font: '900 520px/1 Montserrat', color: 'transparent', WebkitTextStroke: '4px #3dff7a' }, '7');
    const sevenLbl = el(L, 'div', { position: 'absolute', left: 0, width: '1080px', top: '1140px', textAlign: 'center', font: '800 64px Montserrat', letterSpacing: '.18em' }, 'FORMULA');
    const names = ['TT', 'ATT', 'JPH netto', 'JPH brutto', 'Overspeed', 'CT', 'RWT'];
    const chips = names.map((n, i) => { const c = el(L, 'div', { position: 'absolute', left: (i % 2 ? 560 : 90) + 'px', top: (1290 + Math.floor(i / 2) * 104) + 'px', width: i === 6 ? '900px' : '430px', height: '82px', border: `2px solid ${C.line}`, background: 'rgba(8,16,42,.75)', boxSizing: 'border-box', font: '700 38px "JetBrains Mono"', display: 'flex', alignItems: 'center', gap: '18px', paddingLeft: '24px', color: '#e9f0ff' }, `<span style="color:${C.g};font-size:26px">0${i + 1}</span>${n}`); return c; });
    scenes.push(t => {
      B(t, 1 - sp(t - .25, 1.1, .8));
      const hs = S.hook, is = S.intro;
      hookPen.f(t, W('hook', 0) - .05, .9, W('hook', 2) - .2);
      bloom.style.opacity = .55 * Math.exp(-Math.max(0, t - W('hook', 3)) * 5) * (t > W('hook', 3) ? 1 : 0);
      const intro = t >= is.start;
      // dot breath -> becomes the stopwatch centre
      const d = sp(t - .15, 2.2, .55);
      dot.style.transform = `scale(${d * (1 + .12 * Math.sin(t * 6))})`;
      show(dot, !intro);
      // stopwatch
      const r = sp(t - .55, 1.6, .9);
      ring.style.opacity = intro ? 0 : r; ring.style.transform = `scale(${.8 + .2 * r}) rotate(${(1 - r) * -40}deg)`;
      const spin = clamp((t - .9) / 3.2);
      arc.setAttribute('stroke-dashoffset', 1257 * (1 - out(spin)));
      tc.textContent = t < W('hook', 3) ? '' : `${String(Math.floor(fq(t - W('hook', 3)) * 237 % 1000)).padStart(3, '0')} s`;
      show(tc, !intro);
      pop(necha, t, W('hook', 2) - .05, is.start - .3, false, 1.3);
      pop(soniya, t, W('hook', 3) - .05, is.start - .3, true, 1.3);
      // intro: zoom through the dot -> 7
      const z = io(seg(t, is.start - .35, is.start + .15));
      cam.dataset.zoom = intro ? 0 : z;
      pop(seven, t, W('intro', 3) - .1, is.end - .45, true, 1.5);
      seven.style.color = `rgba(61,255,122,${io(seg(t, W('intro', 3) + .2, W('intro', 3) + .7)) * .9})`;
      seven.style.textShadow = t > W('intro', 3) + .2 ? GLOW : 'none';
      pop(sevenLbl, t, W('intro', 4) - .05, is.end - .45, false, 1.2);
      chips.forEach((c, i) => { const p = sp(t - W('intro', 5) - i * .12, 2.4, .7); c.style.opacity = clamp(p * 2); c.style.transform = `translateY(${(1 - p) * 50}px)`; c.style.borderColor = t > W('intro', 5) + i * .12 + .25 ? C.line : C.g; });
    });
  }

  // ---------------- TT (tt1, tt2, tt3)
  {
    const L = group('tt1', 'att1', 'flash', 'TT');
    const B = bg(L, 300, 1150);
    const H = header(L, '01 / 07', 'TT', 'Takt Time', 'takt vaqti');
    const num = el(L, 'div', { position: 'absolute', left: '70px', width: '940px', top: '1000px', textAlign: 'center', font: '700 56px Montserrat' });
    const bar = el(L, 'div', { position: 'absolute', left: '140px', width: '800px', top: '1088px', height: '6px', background: '#fff', transformOrigin: '50% 50%', boxShadow: '0 0 14px rgba(255,255,255,.5)' });
    const den = el(L, 'div', { position: 'absolute', left: '70px', width: '940px', top: '1112px', textAlign: 'center', font: '700 56px Montserrat', color: C.g, textShadow: GLOW });
    const eq1 = mline(L, '= 11,25 daq × 60', { left: 0, width: '1080px', textAlign: 'center', top: '1250px', color: '#dfe7ff' });
    const big = el(L, 'div', { position: 'absolute', left: 0, width: '1080px', top: '1360px', textAlign: 'center', font: '900 230px/1 Montserrat', color: C.g, textShadow: GLOW }); big.className = 'num';
    // tt3 conveyor
    const belt = el(L, 'div', { position: 'absolute', left: '-20px', width: '1120px', top: '1338px', height: '4px', background: C.line });
    const rollers = el(L, 'div', { position: 'absolute', left: '-60px', width: '1200px', top: '1346px', height: '16px', backgroundImage: 'radial-gradient(circle at 8px 8px, rgba(150,180,255,.6) 5px, transparent 6px)', backgroundSize: '60px 16px' });
    const cars = [0, 1, 2, 3, 4].map(i => car(L, 0, 1250, 1));
    const timer = svg(L, 160, 160, { left: '860px', top: '960px' });
    sv(timer, 'circle', { cx: 80, cy: 80, r: 64, fill: 'none', stroke: C.line, 'stroke-width': 6 });
    const tArc = sv(timer, 'circle', { cx: 80, cy: 80, r: 64, fill: 'none', stroke: C.g, 'stroke-width': 8, 'stroke-dasharray': 402, transform: 'rotate(-90 80 80)' });
    const tLbl = el(L, 'div', { position: 'absolute', left: 0, width: '1080px', top: '1385px', textAlign: 'center', font: '600 30px "JetBrains Mono"', color: C.mute }, 'har 675 s → 1 avtomobil');

      brace.style.opacity = ctL.style.opacity = clamp((t - r0 - .5) * 3);
      const rj = out(seg(t, wJoin + .3, wJoin + .8));
      rwtB.style.transform = `scaleX(${rj})`; rwtB.style.transformOrigin = '0 0';
      pop(rwtL, t, wJoin + .5, 1e9, true, 1.3);
      D(t, W('rwt', 19));
    });
  }

  // ---------------- OUTRO
  {
    const L = group('outro', null, 'dot');
    const B = bg(L, 540, 1000);
    const takt = el(L, 'div', { position: 'absolute', left: 0, width: '1080px', top: '620px', textAlign: 'center', font: '900 250px/1 Montserrat', color: C.g, textShadow: GLOW, letterSpacing: '.04em' }, 'TAKT');
    const sub = pen(L, 'liniyaning yurak urishi', { left: '150px', top: '880px', fontSize: '60px' });
    const ecg = svg(L, 1080, 300, { left: '0px', top: '940px' });
    let d = 'M0 150'; const beats = [];
    for (let x = 0; x < 1080; x += 270) { d += ` L${x + 90} 150 L${x + 110} 120 L${x + 125} 150 L${x + 140} 150 L${x + 152} 40 L${x + 166} 250 L${x + 180} 150 L${x + 210} 150 L${x + 228} 110 L${x + 250} 150 L${x + 270} 150`; beats.push(x + 152); }
    const path = sv(ecg, 'path', { d, fill: 'none', stroke: C.g, 'stroke-width': 7, 'stroke-linejoin': 'round' });
    path.style.filter = 'drop-shadow(0 0 10px rgba(61,255,122,.9))';
    const PL = 1080 * 2.2;
    path.setAttribute('stroke-dasharray', PL);
    const head = el(L, 'div', { position: 'absolute', width: '24px', height: '24px', marginLeft: '-12px', marginTop: '-12px', borderRadius: '50%', background: '#eafff0', boxShadow: '0 0 16px 6px rgba(61,255,122,.95), 0 0 110px 44px rgba(61,255,122,.3)' });
    // white paper form (reference "ФОРМА 2-Б / ФОРМА 9" interludes): ticked checklist, highlighter strokes, stamp
    const paper = el(L, 'div', { position: 'absolute', left: '50px', top: '470px', width: '980px', height: '1250px', background: '#eef1f6', boxShadow: '0 30px 80px rgba(0,0,0,.5)', zIndex: 3, overflow: 'hidden', transformOrigin: '50% 50%' });
    el(paper, 'div', { position: 'absolute', left: 0, top: 0, right: 0, height: '150px', background: '#1d2433' });
    el(paper, 'div', { position: 'absolute', left: '44px', top: '38px', font: '900 64px/1 Montserrat', color: '#fff' }, 'FORMA 7');
    el(paper, 'div', { position: 'absolute', left: '370px', top: '42px', font: '700 22px/1.45 "JetBrains Mono"', color: '#c8d0e0', letterSpacing: '.08em' }, 'ISHLAB CHIQARISH FORMULALARI<br>ME · TECHNOLOGY DEPARTMENT');
    const forms = [['TT', 'Takt Time', '450 / 40 × 60 = 675 s'], ['ATT', 'Actual Takt Time', '675 × 85 / 100 = 574 s'], ['JPH netto', 'Jobs Per Hour', '3600 / 675 = 5,3'], ['JPH brutto', 'Jobs Per Hour', '3600 / 574 = 6,3'], ['Overspeed', 'ortiqcha tezlik', '(675 − 574) / 574 = 17,6 %'], ['CT', 'Cycle Time', 'bitta jarayon vaqti'], ['RWT', 'Real Work Time', 'CT − yurish vaqti']];
    const rows = forms.map(([a, en, f], i) => {
      const r = el(paper, 'div', { position: 'absolute', left: '44px', top: (190 + i * 128) + 'px', width: '892px', height: '112px', borderBottom: '2px dashed #c3cad8' });
      const box = el(r, 'div', { position: 'absolute', left: 0, top: '22px', width: '44px', height: '44px', border: '4px solid #1d2433', boxSizing: 'border-box' });
      const tick = svg(r, 60, 60, { left: '-4px', top: '8px' });
      const tp = sv(tick, 'path', { d: 'M8 32 L24 48 L56 6', fill: 'none', stroke: '#14b84a', 'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-dasharray': 80 });
      el(r, 'div', { position: 'absolute', left: '76px', top: '14px', font: '900 38px/1 Montserrat', color: '#1d2433', whiteSpace: 'nowrap' }, `${a} <span style="font:500 26px Inter;color:#5d6678">· ${en}</span>`);
      const hl = el(r, 'div', { position: 'absolute', left: '72px', top: '62px', height: '40px', width: (f.length * 19 + 16) + 'px', background: 'rgba(61,255,122,.55)', transformOrigin: '0 0', transform: 'skewX(-8deg)' });
      el(r, 'div', { position: 'absolute', left: '80px', top: '64px', font: '600 30px "JetBrains Mono"', color: '#1d2433', whiteSpace: 'nowrap' }, f);
      return { r, tp, hl };
    });
    const stamp = el(paper, 'div', { position: 'absolute', left: '520px', top: '1010px', padding: '14px 26px', border: '7px solid #14b84a', color: '#14b84a', font: '900 46px/1 Montserrat', letterSpacing: '.04em', transform: 'rotate(-9deg)', borderRadius: '10px', whiteSpace: 'nowrap', background: 'rgba(238,241,246,.6)' }, 'REJA BAJARILADI');
    const wflash = el(L, 'div', { position: 'absolute', inset: 0, background: '#fff', zIndex: 4 });
    const logo = el(L, 'img', { position: 'absolute', left: '340px', top: '760px', width: '400px' }); logo.src = 'assets/logo_t.png';
    const me = el(L, 'div', { position: 'absolute', left: 0, width: '1080px', top: '1120px', textAlign: 'center', font: '600 34px "JetBrains Mono"', color: C.mute, letterSpacing: '.12em' }, 'ME · TECHNOLOGY DEPARTMENT');
    const black = el(L, 'div', { position: 'absolute', inset: 0, background: '#000', zIndex: 5 });
    scenes.push(t => {
      B(t);
      const o = S.outro, lg = W('outro', 10) - .3, fadeA = io(seg(t, lg - .5, lg));
      pop(takt, t, o.vo - .1, lg - .5, true, 1.3);
      sub.f(t, W('outro', 3) - .1, 1.0, W('outro', 6) - .4);
      const dk = out(seg(t, o.start + .2, W('outro', 5)));
      path.setAttribute('stroke-dashoffset', PL * (1 - dk));
      const hp = path.getPointAtLength(PL * dk * .999);
      head.style.left = hp.x + 'px'; head.style.top = (940 + hp.y) + 'px'; head.style.opacity = dk > 0 && dk < 1 ? 1 : 0;
      // paper: white flash in, rows tick + highlighter, stamp, then it collapses to a line (CRT off)
      const p0 = W('outro', 6) - .2, p1 = lg - .45;
      wflash.style.opacity = t > p0 - .1 ? Math.exp(-Math.max(0, t - p0) * 6) * clamp((t - p0 + .1) * 10) : 0;
      const pin = sp(t - p0, 2.4, .8), pc = io(seg(t, p1, p1 + .35));
      paper.style.visibility = t >= p0 && t < p1 + .4 ? 'inherit' : 'hidden';
      paper.style.transform = `translateY(${(1 - pin) * 120}px) rotate(${(1 - pin) * 3}deg) scaleY(${1 - pc * .995}) scaleX(${1 - pc * .1})`;
      paper.style.filter = pc > 0 ? `brightness(${1 + pc * 2})` : 'none';
      rows.forEach((R, i) => { const ti = p0 + .25 + i * .2; R.r.style.opacity = clamp((t - ti + .15) * 6); R.tp.setAttribute('stroke-dashoffset', 80 * (1 - out(seg(t, ti, ti + .18)))); R.hl.style.transform = `skewX(-8deg) scaleX(${out(seg(t, ti + .08, ti + .35))})`; });
      const sp0 = W('outro', 8) + .3, sk = sp(t - sp0, 3, .5);
      stamp.style.opacity = t >= sp0 ? 1 : 0; stamp.style.transform = `rotate(-9deg) scale(${2.2 - 1.2 * sk})`;
      // heartbeat: everything pulses on each takt beat
      const bt = Math.max(0, t - W('outro', 0)) % 1.1, pulse = Math.exp(-bt * 7);
      ecg.style.opacity = 1 - fadeA; ecg.style.transform = `scaleY(${1 + .12 * pulse})`;
      takt.style.textShadow = `0 0 ${14 + 30 * pulse}px rgba(61,255,122,.85), 0 0 60px rgba(61,255,122,.35)`;
      const lp = sp(t - lg, 1.8, .8);
      logo.style.opacity = clamp(lp * 1.5); logo.style.transform = `scale(${.85 + .15 * lp})`; logo.style.filter = `blur(${(1 - clamp(lp * 1.4)) * 12}px)`;
      me.style.opacity = clamp((t - lg - .6) * 2);
      black.style.opacity = seg(t, T - .8, T - .05);
    });
  }
}

// ---------- transitions (all taken from the reference)
// flash: full green + Enter key, then a giant black word slams on the green (reference 44.9 s "↵" -> 45.2 s "ВОТ")
const flash = el(cam, 'div', { position: 'absolute', inset: 0, background: C.g, zIndex: 90, display: 'flex', alignItems: 'center', justifyContent: 'center' });
const enter = svg(flash, 360, 280, { position: 'absolute', left: '360px', top: '820px' });
const ePath = sv(enter, 'path', { d: 'M320 20 L320 170 L60 170 M130 100 L60 170 L130 240', fill: 'none', stroke: '#06210f', 'stroke-width': 26, 'stroke-linecap': 'square', 'stroke-dasharray': 700 });
const fWord = el(flash, 'div', { position: 'absolute', left: 0, width: '1080px', top: '700px', textAlign: 'center', font: '900 400px/1 Montserrat', color: '#04140a', letterSpacing: '-.03em' });
// glitch: horizontal bands of the new scene tear in, layers jitter sideways, green streaks (reference 13.8 / 15.8 / 16.1 s)
const streaks = [...Array(9)].map(() => el(cam, 'div', { position: 'absolute', height: '10px', zIndex: 91, background: C.g, boxShadow: '0 0 18px rgba(61,255,122,.9)' }));
// dot: the scene goes dark, only the green light dot is left (reference 10.3 s); it becomes the next scene's pen
const dark = el(cam, 'div', { position: 'absolute', inset: 0, background: '#03060f', zIndex: 89 });
const tDot = el(cam, 'div', { position: 'absolute', width: '22px', height: '22px', marginLeft: '-11px', marginTop: '-11px', borderRadius: '50%', background: '#eafff0', zIndex: 92, boxShadow: '0 0 16px 6px rgba(61,255,122,.95), 0 0 120px 50px rgba(61,255,122,.35)' });
const GW = .45;   // glitch window
function transitions(t) {
  flash.style.opacity = 0; flash.style.visibility = 'hidden';
  streaks.forEach(e => e.style.visibility = 'hidden');
  dark.style.opacity = 0; tDot.style.visibility = 'hidden';
  groups.forEach(g => {
    const tb = S[g.k0].start;
    if (g.inType === 'flash' && t > tb - .14 && t < tb + .62) {
      const k = t < tb ? seg(t, tb - .14, tb - .04) : 1 - seg(t, tb + .45, tb + .62);
      flash.style.visibility = 'inherit'; flash.style.opacity = k;
      ePath.setAttribute('stroke-dashoffset', 700 * (1 - out(seg(t, tb - .1, tb + .08))));
      enter.style.opacity = t < tb + .14 ? 1 : 0;
      fWord.textContent = g.word;
      const p = sp(t - tb - .14, 3.2, .5);
      fWord.style.opacity = t >= tb + .14 ? 1 : 0; fWord.style.transform = `scale(${1.25 - .25 * p})`;
    }
    if (g.inType === 'glitch' && t > tb - GW / 2 && t < tb + GW / 2) {
      const f = Math.floor(fq(t) * 30);
      streaks.forEach((e, j) => { if (hash(f * 7 + j) < .6) { e.style.visibility = 'inherit'; e.style.top = Math.floor(hash(f * 3 + j * 11) * 1920) + 'px'; e.style.left = Math.floor(hash(f + j * 5) * 600 - 100) + 'px'; e.style.width = (120 + hash(f * 13 + j) * 700) + 'px'; e.style.height = (4 + hash(f * 17 + j) * 22) + 'px'; e.style.background = hash(f + j) < .3 ? '#eafff0' : C.g; } });
    }
    if (g.inType === 'dot' && t > tb - .7 && t < tb + .5) {
      dark.style.opacity = t < tb ? io(seg(t, tb - .7, tb - .25)) : 1 - seg(t, tb + .1, tb + .45);
      tDot.style.visibility = 'inherit';
      const k = io(seg(t, tb - .1, tb + .3));
      tDot.style.left = lerp(540, 20, k) + 'px'; tDot.style.top = lerp(1090, 1090, k) + 'px';
      tDot.style.transform = `scale(${(1 - seg(t, tb + .3, tb + .5)) * (.6 + .4 * sp(t - tb + .45, 2, .5))})`;
    }
  });
}
function groupVis(t) {
  groups.forEach((g, i) => {
    const t0 = S[g.k0].start, t1 = g.k1 ? S[g.k1].start : 1e9;
    const next = groups[i + 1];
    const tail = next && next.inType === 'glitch' ? GW / 2 : 0;
    const head = g.inType === 'glitch' ? GW / 2 : 0;
    const on = t >= t0 - head && t < t1 + tail;
    g.L.style.visibility = on ? 'inherit' : 'hidden';
    g.L.style.transform = '';
    if (g.inType === 'glitch' && t < t0 + head) {
      // the new scene arrives in torn horizontal bands; both layers jitter
      const k = seg(t, t0 - head, t0 + head), f = Math.floor(fq(t) * 30), n = 24, bands = [];
      for (let b = 0; b < n; b++) if (hash(b * 7.3 + 1) < k * 1.15 - .05 + .1 * Math.sin(f + b)) bands.push(b);
      g.L.style.clipPath = k >= 1 ? 'none' : bands.length ? `polygon(${bands.map(b => `0 ${b * 80}px, 1080px ${b * 80}px, 1080px ${b * 80 + 80}px, 0 ${b * 80 + 80}px, 0 ${b * 80}px`).join(', ')})` : 'inset(100% 0 0 0)';
      const jx = (hash(f * 3.1) - .5) * 60 * Math.sin(Math.PI * k);
      g.L.style.transform = `translateX(${jx}px)`;
      if (groups[i - 1]) groups[i - 1].L.style.transform = `translateX(${-jx * .8}px) skewX(${jx * .05}deg)`;
    } else g.L.style.clipPath = 'none';
  });
}

// ---------- captions: written text, one sentence at a time, spoken words lit
const cap = document.getElementById('caption');
let CAPS = [];
function buildCaptions() {
  for (const ln of NAR.lines) {
    const sc = S[ln.id], sp = sc.words;
    const written = ln.text.replace(/[{}]/g, '').split(/\s+/).filter(Boolean);
    // map written words to spoken time by character position (numbers are spoken longer than written)
    const spLen = sp.reduce((a, w) => a + w.text.length + 1, 0), wrLen = written.reduce((a, w) => a + w.length + 1, 0);
    const spAt = f => { let acc = 0; for (const w of sp) { const l = (w.text.length + 1) / spLen; if (acc + l >= f) return lerp(w.t, w.e, (f - acc) / l); acc += l; } return sp[sp.length - 1].e; };
    let acc = 0, sent = [], cur = [];
    written.forEach((w, i) => { cur.push({ text: w, t: spAt(acc / wrLen + 1e-4) }); acc += w.length + 1; if (/[.!?:]$/.test(w) || i === written.length - 1) { sent.push(cur); cur = []; } });
    sent.forEach((s, si) => {
      const box = el(cap, 'div', { position: 'absolute', left: 0, top: 0, width: '940px' });
      const ul = el(box, 'div', { position: 'absolute', height: '4px', background: C.g, boxShadow: '0 0 12px rgba(61,255,122,.9)', borderRadius: '2px' });
      const spans = s.map(w => { const e = el(box, 'span', {}, w.text); e.className = 'w'; return e; });
      const end = si < sent.length - 1 ? sent[si + 1][0].t - .05 : sc.voEnd + .25;
      CAPS.push({ box, ul, spans, words: s, t0: s[0].t - .12, t1: end });
    });
  }
}
function captions(t) {
  for (const c of CAPS) {
    const on = t >= c.t0 && t < c.t1;
    c.box.style.visibility = on ? 'inherit' : 'hidden';
    if (!on) continue;
    const p = sp(t - c.t0, 3, .85);
    c.box.style.transform = `translateY(${(1 - p) * 24}px)`; c.box.style.opacity = clamp(p * 2);
    c.words.forEach((w, i) => {
      const e = c.spans[i], said = t >= w.t, next = c.words[i + 1], curr = said && (!next || t < next.t);
      e.style.color = curr ? C.g : said ? '#ffffff' : 'rgba(255,255,255,.32)';
      e.style.textShadow = curr ? GLOW : 'none';
      if (curr) { const k = out(seg(t, w.t, next ? next.t : w.t + .3)); Object.assign(c.ul.style, { left: e.offsetLeft + 'px', top: (e.offsetTop + e.offsetHeight + 2) + 'px', width: (e.offsetWidth * k) + 'px' }); }
    });
  }
}

// ---------- HUD: department, brand, timecode (the reference's "REC 00:00:00" chrome)
const hud = el(document.getElementById('stage'), 'div', { position: 'absolute', inset: 0, zIndex: 85, pointerEvents: 'none' });
el(hud, 'div', { position: 'absolute', left: '70px', top: '90px', font: '900 54px/1 Montserrat', color: '#fff' }, 'ME<span style="font:600 20px/1.1 \'JetBrains Mono\';display:inline-block;margin-left:12px;color:#c8d4f5;vertical-align:4px">Technology<br>Department</span>');
el(hud, 'div', { position: 'absolute', right: '70px', top: '92px', font: '900 48px/1 Montserrat', color: '#ff5a3c' }, 'ADM<span style="display:block;font:700 16px \'JetBrains Mono\';color:#c8d4f5;letter-spacing:.42em;text-align:right;margin-top:4px">JIZZAX</span>');
el(hud, 'div', { position: 'absolute', left: '70px', right: '70px', top: '180px', height: '2px', background: C.line });
const rec = el(hud, 'div', { position: 'absolute', left: '70px', bottom: '90px', font: '600 24px "JetBrains Mono"', color: C.mute }); rec.className = 'num';
const prog = el(hud, 'div', { position: 'absolute', right: '70px', bottom: '96px', width: '420px', height: '4px', background: 'rgba(150,180,255,.2)' });
const progF = el(prog, 'div', { position: 'absolute', left: 0, top: 0, bottom: 0, background: C.g, boxShadow: '0 0 10px rgba(61,255,122,.8)' });
function hudF(t) {
  const s = fq(t), mm = String(Math.floor(s / 60)).padStart(2, '0'), ss = String(Math.floor(s % 60)).padStart(2, '0'), ff = String(Math.floor((s % 1) * 30)).padStart(2, '0');
  rec.innerHTML = `<span style="color:${Math.floor(s * 1.5) % 2 ? '#ff4d5e' : 'transparent'}">●</span> REC ${mm}:${ss}:${ff}`;
  progF.style.width = (420 * t / T) + 'px';
  hud.style.opacity = 1 - seg(t, T - .8, T - .05);
}

// ---------- camera: slow handheld drift (the reference is filmed by hand) + push on the zoom-through
function camera(t) {
  const z = +(cam.dataset.zoom || 0);
  const x = Math.sin(t * .7) * 5 + Math.sin(t * 1.9) * 2, y = Math.cos(t * .55) * 6 + Math.sin(t * 1.3) * 2, r = Math.sin(t * .45) * .25;
  cam.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg) scale(${1 + z * z * 5})`;
  cam.style.transformOrigin = '540px 1100px';
}

window.seek = async (t) => {
  groupVis(t);
  for (const f of scenes) f(t);
  transitions(t);
  captions(t);
  hudF(t);
  camera(t);
};
Promise.all([fetch('audio/timeline.json').then(r => r.json()), fetch('narration.json').then(r => r.json())]).then(async ([tl, nar]) => {
  TL = tl; S = tl.scenes; T = tl.total; NAR = nar;
  build();
  buildCaptions();
  await document.fonts.ready;
  window.seek(0);
  window.ready = true;
  if (location.hash === '#play') {
    let now = 0, last = performance.now(), play = true;
    const tick = ts => { if (play) { now = (now + (ts - last) / 1000) % T; window.seek(now); } last = ts; requestAnimationFrame(tick); };
    addEventListener('keydown', e => { if (e.code === 'Space') play = !play; });
    requestAnimationFrame(tick);
  }
});
