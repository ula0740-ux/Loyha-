<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Ishlab chiqarish formulalari</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0a1431; font-family: Montserrat, sans-serif; color: #fff; }
  #world { position: absolute; left: 0; top: 0; width: 6480px; height: 5760px; }
  .num { font-variant-numeric: tabular-nums; }
  #caption { position: absolute; left: 70px; width: 940px; top: 200px; font: 700 48px/1.28 Montserrat; z-index: 80; }
  #caption .w { display: inline-block; margin-right: .26em; }
</style>
</head>
<body>
<div id="stage"><div id="world"></div><div id="caption"></div></div>
<script>
// Style reference: the user's laptop-screen film (navy blueprint grid, neon green light, welding-pen writing,
// kinetic words that land hot green and cool to white, wireframe panels drawn by a light, mono typing,
// one big canvas the camera pans across following a green laser line, green Enter flash, glitch tears, white form sheet).
const C = { g: '#3dff7a', line: 'rgba(150,180,255,.45)', mute: 'rgba(175,198,255,.62)', red: '#ff4d5e', grid: 'rgba(130,160,255,.08)', grid2: 'rgba(130,160,255,.17)' };
const GLOW = '0 0 14px rgba(61,255,122,.8), 0 0 46px rgba(61,255,122,.38)';
const HOT = '0 0 10px rgba(255,255,240,.95), 0 0 34px rgba(61,255,122,.95), 0 0 90px rgba(61,255,122,.55)';
const SOFT = '0 0 18px rgba(61,255,122,.45), 0 0 50px rgba(61,255,122,.2)';

// ---------- math
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const io = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = x => 1 - Math.pow(1 - clamp(x), 3);
const inn = x => Math.pow(clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const sp = (t, f = 2.2, z = .78) => { if (t <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + z * w / wd * Math.sin(wd * t)); };
const fq = t => Math.round(t * 30) / 30;   // frame-snapped time for counters / typing / flicker
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };
const uz = (n, d = 0) => n.toFixed(d).replace('.', ',');

// ---------- DOM
const world = document.getElementById('world');
function el(parent, tag, css = {}, html = '') { const e = document.createElement(tag); Object.assign(e.style, css); if (html) e.innerHTML = html; parent.appendChild(e); return e; }
const NS = 'http://www.w3.org/2000/svg';
function svg(parent, w, h, css = {}) { const s = document.createElementNS(NS, 'svg'); s.setAttribute('width', w); s.setAttribute('height', h); s.setAttribute('viewBox', `0 0 ${w} ${h}`); Object.assign(s.style, { position: 'absolute', overflow: 'visible' }, css); parent.appendChild(s); return s; }
function sv(parent, tag, a) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); parent.appendChild(e); return e; }
const abs = (x, y, extra = {}) => Object.assign({ position: 'absolute', left: x + 'px', top: y + 'px' }, extra);

// ---------- timeline
let TL, S, T, NAR;
const W = (id, i) => S[id].words[i].t;

// =====================================================================================
// TEXT PRIMITIVES (all taken from the reference)

/** spark pool: the welding head throws short-lived sparks that fall under gravity */
function sparks(parent, n = 16) {
  const ps = [...Array(n)].map(() => el(parent, 'div', { position: 'absolute', width: '5px', height: '5px', marginLeft: '-2px', marginTop: '-2px', borderRadius: '50%', background: '#fffbe6', boxShadow: '0 0 8px 2px rgba(61,255,122,.9)', visibility: 'hidden' }));
  return (t, headAt, t0, t1) => {
    ps.forEach(p => p.style.visibility = 'hidden');
    const RATE = 40, LIFE = .45; let k = 0;
    const m1 = Math.floor((Math.min(t, t1) - t0) * RATE), m0 = Math.max(0, Math.floor((t - LIFE - t0) * RATE));
    for (let m = m1; m >= m0 && k < ps.length; m--) {
      const tb = t0 + m / RATE, age = t - tb; if (age < 0 || age > LIFE || tb > t1) continue;
      const h = headAt(tb); if (!h) continue;
      const vx = (hash(m * 3.7) - .5) * 520, vy = -120 - hash(m * 5.3) * 420, g = 1700;
      const p = ps[k++], life = age / LIFE;
      p.style.visibility = 'inherit';
      p.style.left = (h.x + vx * age) + 'px'; p.style.top = (h.y + vy * age + .5 * g * age * age) + 'px';
      p.style.opacity = 1 - life; p.style.transform = `scale(${1.4 - life})`;
      p.style.background = life < .3 ? '#fffbe6' : C.g;
    }
  };
}
/** welding-pen writing (reference intro): letters are burned in left to right behind a white-hot flickering head
 *  that throws sparks; fresh letters glow white-hot and cool to a soft green halo */
function weld(parent, text, css) {
  const box = el(parent, 'div', Object.assign({ position: 'absolute', whiteSpace: 'nowrap', font: '200 72px/1.15 Inter', color: '#fff' }, css));
  const ch = [...text].map(c => el(box, 'span', { display: 'inline-block', whiteSpace: 'pre' }, c));
  const head = el(box, 'div', { position: 'absolute', width: '16px', height: '16px', marginLeft: '-8px', marginTop: '-8px', borderRadius: '50%', background: '#ffffff', boxShadow: '0 0 10px 4px rgba(255,255,230,.95), 0 0 30px 10px rgba(61,255,122,.9), 0 0 110px 50px rgba(61,255,122,.35)' });
  const SP = sparks(box);
  let xs = null, H = 0;
  const headAt = (t0, dur) => tt => { const k = seg(tt, t0, t0 + dur), pos = k * ch.length, j = Math.min(ch.length - 1, Math.floor(pos)); return { x: lerp(j ? xs[j - 1] : 0, xs[j], pos - Math.floor(pos)), y: H * (.55 + .3 * Math.sin(pos * 2.4)) }; };
  return { box, f(t, t0, dur = null, tOut = 1e9) {
    if (!xs) { xs = ch.map(c => c.offsetLeft + c.offsetWidth); H = box.offsetHeight; }
    dur = dur ?? Math.max(.45, ch.length * .045);
    const k = seg(t, t0, t0 + dur), pos = k * ch.length;
    ch.forEach((c, j) => {
      const a = clamp(pos - j), tj = t0 + j / ch.length * dur, heat = 1 - seg(t, tj, tj + .55);
      c.style.clipPath = `inset(-20% ${(1 - a) * 100}% -20% -5%)`;
      c.style.textShadow = a <= 0 ? 'none' : heat > .02 ? `0 0 ${6 + 10 * heat}px rgba(255,255,235,${heat}), 0 0 ${20 + 30 * heat}px rgba(61,255,122,${.5 + .5 * heat})` : SOFT;
    });
    const on = t >= t0 && t < t0 + dur;
    const h = on ? headAt(t0, dur)(t) : null;
    head.style.visibility = on ? 'inherit' : 'hidden';
    if (h) { head.style.left = h.x + 'px'; head.style.top = h.y + 'px'; head.style.transform = `scale(${.7 + hash(Math.floor(fq(t) * 30)) * .8})`; }
    SP(t, headAt(t0, dur), t0, t0 + dur);
    box.style.visibility = t >= t0 ? 'inherit' : 'hidden';
    exitEcho(box, t, tOut);
  } };
}
/** kinetic stack (reference "НИ-ХРЕ-НА." / "МОУШН ГРАФИКА"): words land one by one, hot green -> white; the last stays green */
function kin(parent, words, css, size = 140) {
  const box = el(parent, 'div', Object.assign({ position: 'absolute', font: `900 ${size}px/.98 Montserrat`, letterSpacing: '-.01em', whiteSpace: 'nowrap' }, css));
  const ws = words.map(w => el(box, 'div', { transformOrigin: '0 70%' }, w));
  return { box, f(t, times, tOut = 1e9) {
    ws.forEach((w, i) => {
      const t0 = times[i] ?? times[times.length - 1] + .18 * (i - times.length + 1), last = i === ws.length - 1;
      const p = sp(t - t0, 3.0, .55);
      w.style.opacity = t >= t0 ? clamp((t - t0) * 25) : 0;
      w.style.transform = `scale(${1.22 - .22 * p})`;
      const c = last ? 1 : 1 - seg(t, t0 + .15, t0 + .6), hot = 1 - seg(t, t0, t0 + .25);
      w.style.color = `rgb(${Math.round(lerp(255, 61, c) + hot * (255 - lerp(255, 61, c)) * .6)},255,${Math.round(Math.min(255, lerp(255, 122, c) + hot * 80))})`;
      w.style.textShadow = hot > .05 ? HOT : c > .5 ? GLOW : SOFT;
    });
    exitEcho(box, t, tOut);
  } };
}
/** echo exit (reference 5.0 s / 20.8 s): the element lifts away leaving fading copies */
function exitEcho(e, t, tOut) {
  if (t < tOut) { e.style.transform = ''; e.style.opacity = 1; e.style.filter = ''; return; }
  const k = seg(t, tOut, tOut + .45);
  e.style.opacity = 1 - inn(k); e.style.transform = `translateY(${-70 * inn(k)}px)`;
  e.style.filter = `blur(${k * 5}px) drop-shadow(0 ${26 * out(k)}px 0 rgba(255,255,255,${.35 * (1 - k)})) drop-shadow(0 ${52 * out(k)}px 0 rgba(255,255,255,${.2 * (1 - k)}))`;
}
/** big number that pops in green */
function bigNum(parent, css, size = 220) { const e = el(parent, 'div', Object.assign({ position: 'absolute', font: `900 ${size}px/1 Montserrat`, color: C.g, whiteSpace: 'nowrap', transformOrigin: '0 70%' }, css)); e.className = 'num'; return e; }
function popNum(e, t, t0, text, tOut = 1e9) {
  const p = sp(t - t0, 3.0, .55), hot = 1 - seg(t, t0, t0 + .35);
  e.textContent = t >= t0 ? text : '';
  if (t >= tOut) { exitEcho(e, t, tOut); return; }
  e.style.filter = ''; e.style.opacity = t >= t0 ? 1 : 0;
  e.style.transform = `scale(${1.2 - .2 * p})`;
  e.style.textShadow = hot > .05 ? HOT : GLOW;
}
/** wireframe panel whose outline is drawn by the light (reference 23.9 s), then fills */
function panel(parent, x, y, w, h, label = '') {
  const p = el(parent, 'div', abs(x, y, { width: w + 'px', height: h + 'px' }));
  const bg = el(p, 'div', { position: 'absolute', inset: 0, background: 'rgba(8,16,42,.78)' });
  const s = svg(p, w, h, { left: 0, top: 0 });
  const per = 2 * (w + h);
  const r = sv(s, 'rect', { x: 0, y: 0, width: w, height: h, fill: 'none', stroke: 'rgba(170,195,255,.6)', 'stroke-width': 2, 'stroke-dasharray': per });
  const hd = el(p, 'div', { position: 'absolute', width: '14px', height: '14px', marginLeft: '-7px', marginTop: '-7px', borderRadius: '50%', background: '#fff', boxShadow: '0 0 12px 5px rgba(61,255,122,.95), 0 0 60px 24px rgba(61,255,122,.35)' });
  const lab = label ? el(p, 'div', { position: 'absolute', left: '18px', top: '-36px', font: '600 22px "JetBrains Mono"', color: C.mute, letterSpacing: '.1em' }, label) : null;
  const inner = el(p, 'div', { position: 'absolute', inset: 0 });
  const at = d => { if (d < w) return [d, 0]; d -= w; if (d < h) return [w, d]; d -= h; if (d < w) return [w - d, h]; d -= w; return [0, h - d]; };
  return { p, inner, f(t, t0, tOut = 1e9) {
    const k = io(seg(t, t0, t0 + .6));
    r.setAttribute('stroke-dashoffset', per * (1 - k));
    bg.style.opacity = seg(t, t0 + .3, t0 + .7);
    const [hx, hy] = at(per * k); hd.style.left = hx + 'px'; hd.style.top = hy + 'px'; hd.style.visibility = k > 0 && k < 1 ? 'inherit' : 'hidden';
    if (lab) lab.style.opacity = clamp((t - t0) * 3);
    inner.style.opacity = seg(t, t0 + .35, t0 + .6);
    p.style.visibility = t >= t0 ? 'inherit' : 'hidden';
    exitEcho(p, t, tOut);
  } };
}
/** mono typing with a block cursor (reference terminal / code panels); [x] marks green words */
function typer(parent, text, css) {
  const e = el(parent, 'div', Object.assign({ position: 'absolute', font: '600 40px/1.4 "JetBrains Mono"', color: '#e6edff', whiteSpace: 'pre-wrap' }, css));
  const plainLen = text.replace(/[\[\]]/g, '').length;
  return (t, t0, cps = 38, tOut = 1e9) => {
    let n = Math.floor(Math.max(0, fq(t) - t0) * cps);
    const done = n >= plainLen;
    // walk the marked-up text, counting only visible characters
    let outS = '', vis = 0, inG = false;
    for (const c of text) { if (c === '[') { inG = true; outS += `<span style="color:${C.g};text-shadow:${GLOW}">`; continue; } if (c === ']') { inG = false; outS += '</span>'; continue; } if (vis >= n) break; outS += c; vis++; }
    if (inG) outS += '</span>';
    const cur = t >= t0 && (!done || Math.floor(fq(t) * 2.5) % 2 === 0) && t < t0 + plainLen / cps + 1.2 ? `<span style="background:${C.g};color:${C.g};box-shadow:0 0 10px ${C.g}">▌</span>` : '';
    e.innerHTML = t >= t0 ? outS + cur : '';
    exitEcho(e, t, tOut);
  };
}
/** small mono tag chip, e.g. "01 · TT" */
function tag(parent, x, y, text) { const e = el(parent, 'div', abs(x, y, { font: '700 26px "JetBrains Mono"', color: C.g, border: `2px solid ${C.g}`, padding: '6px 14px', letterSpacing: '.14em', boxShadow: '0 0 14px rgba(61,255,122,.35)' }), text); return (t, t0, tOut = 1e9) => { e.style.visibility = t >= t0 ? 'inherit' : 'hidden'; e.style.clipPath = `inset(0 ${(1 - out(seg(t, t0, t0 + .3))) * 100}% 0 0)`; exitEcho(e, t, tOut); }; }
const CAR = 'M8 52 L26 50 L48 28 Q54 22 66 22 L118 22 Q128 22 136 30 L156 48 L182 52 Q190 54 190 62 L190 70 L8 70 Z';
function car(parent, x, y, s = 1) {
  const g = svg(parent, 200, 90, { left: x + 'px', top: y + 'px', transformOrigin: '0 0', transform: `scale(${s})` });
  sv(g, 'path', { d: CAR, fill: 'rgba(61,255,122,.12)', stroke: C.g, 'stroke-width': 4, 'stroke-linejoin': 'round' });
  sv(g, 'path', { d: 'M56 30 L70 30 L70 48 L42 48 Z M78 30 L116 30 L132 48 L78 48 Z', fill: 'none', stroke: C.g, 'stroke-width': 3 });
  for (const cx of [50, 150]) { sv(g, 'circle', { cx, cy: 72, r: 15, fill: '#0a1431', stroke: C.g, 'stroke-width': 4 }); sv(g, 'circle', { cx, cy: 72, r: 4, fill: C.g }); }
  g.style.filter = 'drop-shadow(0 0 8px rgba(61,255,122,.6))';
  return g;
}

// =====================================================================================
// WORLD: one big blueprint canvas; every view is a 1080x1920 window on it, the camera pans between them
const COLS = 6, ROWS = 3;
const VIEW = { hook: [0, 0], intro: [0, 1], tt1: [1, 1], tt2: [1, 2], tt3: [1, 2], up: [2, 2], att1: [2, 1], att2: [2, 0], jph1: [3, 0], jph2: [3, 1], jph3: [3, 1], over1: [4, 1], over2: [4, 2], ct: [5, 2], rwt: [5, 1], outro: [5, 0] };
const vx = id => VIEW[id][0] * 1080, vy = id => VIEW[id][1] * 1920;
function buildWorld() {
  el(world, 'div', { position: 'absolute', inset: 0, background: 'radial-gradient(ellipse at 50% 50%, #13235a 0%, #0a1431 55%, #070e26 100%)' });
  el(world, 'div', { position: 'absolute', inset: 0, backgroundImage: `linear-gradient(${C.grid2} 2px, transparent 2px), linear-gradient(90deg, ${C.grid2} 2px, transparent 2px), linear-gradient(${C.grid} 1px, transparent 1px), linear-gradient(90deg, ${C.grid} 1px, transparent 1px)`, backgroundSize: '216px 216px, 216px 216px, 54px 54px, 54px 54px' });
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) el(world, 'div', { position: 'absolute', left: (c * 1080 + 540 - 600 + (hash(c * 7 + r) - .5) * 400) + 'px', top: (r * 1920 + 1100 - 600) + 'px', width: '1200px', height: '1200px', borderRadius: '50%', background: 'radial-gradient(circle, rgba(61,255,122,.16) 0%, rgba(61,255,122,.05) 40%, transparent 68%)' });
}
const VIEWS = [];
const view = id => { const v = el(world, 'div', { position: 'absolute', left: vx(id) + 'px', top: vy(id) + 'px', width: '1080px', height: '1920px' }); VIEWS.push(v); return v; };

// ---------- camera path (pans between views, following the laser)
let MOVES = [], laserSegs = [];
function buildCamera() {
  let prev = null;
  for (const id of TL.order) {
    const p = [vx(id), vy(id)];
    if (prev && (prev[0] !== p[0] || prev[1] !== p[1])) { const ts = S[id].start; MOVES.push({ t0: ts - .35, t1: ts + .65, from: prev, to: p, id }); }
    prev = p;
  }
  // laser: a light line from each view to the next, drawn just ahead of the camera, stays dim afterwards
  const laser = svg(world, 6480, 5760, { left: 0, top: 0, zIndex: 5, pointerEvents: 'none' });
  for (const m of MOVES) {
    const horiz = m.to[0] !== m.from[0];
    const a = horiz ? [m.from[0] + 540, m.from[1] + 1800] : [m.from[0] + 1000, m.from[1] + (m.to[1] > m.from[1] ? 1800 : 420)];
    const b = horiz ? [m.to[0] + 1000, a[1]] : [a[0], m.to[1] + (m.to[1] > m.from[1] ? 420 : 1800)];
    const path = sv(laser, 'path', { d: `M${a[0]} ${a[1]} L${b[0]} ${b[1]}`, fill: 'none', stroke: C.g, 'stroke-width': 5, 'stroke-linecap': 'round' });
    path.style.filter = 'drop-shadow(0 0 8px rgba(61,255,122,.95))';
    const len = path.getTotalLength(); path.setAttribute('stroke-dasharray', len);
    const hd = el(world, 'div', { position: 'absolute', width: '22px', height: '22px', marginLeft: '-11px', marginTop: '-11px', borderRadius: '50%', background: '#fff', zIndex: 6, boxShadow: '0 0 14px 6px rgba(61,255,122,.95), 0 0 120px 50px rgba(61,255,122,.35)' });
    laserSegs.push({ m, path, len, hd });
  }
}
function camAt(t) {
  let x = 0, y = 0;
  for (const m of MOVES) { if (t >= m.t1) { [x, y] = m.to; } else if (t > m.t0) { const k = io(seg(t, m.t0, m.t1)); return [lerp(m.from[0], m.to[0], k), lerp(m.from[1], m.to[1], k)]; } }
  return [x, y];
}
function laserF(t) {
  for (const L of laserSegs) {
    const k = io(seg(t, L.m.t0 - .2, L.m.t1 - .05));
    L.path.setAttribute('stroke-dashoffset', L.len * (1 - k));
    L.path.style.opacity = t > L.m.t1 + .4 ? .3 : 1;
    const on = k > 0 && k < 1; L.hd.style.visibility = on ? 'inherit' : 'hidden';
    if (on) { const p = L.path.getPointAtLength(L.len * k); L.hd.style.left = p.x + 'px'; L.hd.style.top = p.y + 'px'; }
  }
}

// =====================================================================================
const scenes = [];
function build() {
  buildWorld();
  // ---------------- HOOK: dot -> tilted grid settles -> welded line -> kinetic syllables
  {
    const V = view('hook');
    const dot = el(V, 'div', abs(540, 960, { width: '26px', height: '26px', marginLeft: '-13px', marginTop: '-13px', borderRadius: '50%', background: '#fff', boxShadow: '0 0 16px 6px rgba(61,255,122,.95), 0 0 140px 60px rgba(61,255,122,.35)' }));
    const w1 = weld(V, 'Bitta avtomobil', { left: '90px', top: '640px', fontSize: '96px' });
    const k1 = kin(V, ['NE-CHA', 'SO-NI-YA?'], { left: '90px', top: '860px' }, 165);
    const ring = svg(V, 300, 300, { left: '700px', top: '1300px' });
    sv(ring, 'circle', { cx: 150, cy: 150, r: 120, fill: 'none', stroke: C.line, 'stroke-width': 3, 'stroke-dasharray': '4 10' });
    const arc = sv(ring, 'circle', { cx: 150, cy: 150, r: 120, fill: 'none', stroke: C.g, 'stroke-width': 8, 'stroke-dasharray': 754, transform: 'rotate(-90 150 150)', 'stroke-linecap': 'round' });
    arc.style.filter = 'drop-shadow(0 0 8px rgba(61,255,122,.9))';
    const sec = el(V, 'div', abs(700, 1418, { width: '300px', textAlign: 'center', font: '700 48px "JetBrains Mono"' })); sec.className = 'num';
    scenes.push(t => {
      const d = sp(t - .1, 2, .5);
      dot.style.transform = `scale(${d * (1 + .15 * Math.sin(t * 7))})`;
      dot.style.visibility = t < W('hook', 0) ? 'inherit' : 'hidden';
      w1.f(t, W('hook', 0) - .05, .85, S.intro.start - .45);
      k1.f(t, [W('hook', 2) - .05, W('hook', 3) - .05], S.intro.start - .45);
      const rk = seg(t, W('hook', 3), S.intro.start - .3);
      ring.style.opacity = sec.style.opacity = t > W('hook', 3) - .1 ? 1 - seg(t, S.intro.start - .45, S.intro.start - .1) : 0;
      arc.setAttribute('stroke-dashoffset', 754 * (1 - rk));
      sec.textContent = `${String(Math.floor(rk * 675)).padStart(3, '0')} s`;
    });
  }
  // ---------------- INTRO: 7 + list of the seven
  {
    const V = view('intro');
    const seven = el(V, 'div', abs(70, 470, { font: '900 520px/1 Montserrat', color: 'transparent', WebkitTextStroke: '4px #3dff7a', transformOrigin: '0 70%' }), '7');
    const k = kin(V, ['ASOSIY', 'KOʻRSATKICH'], { left: '420px', top: '640px' }, 82);
    const P = panel(V, 70, 1080, 940, 690, 'MUNDARIJA');
    const names = ['Takt Time', 'Actual Takt Time', 'Jobs Per Hour · netto', 'Jobs Per Hour · brutto', 'Overspeed', 'Cycle Time', 'Real Work Time'];
    const rows = names.map((n, i) => typer(P.inner, `[0${i + 1}]  ${n}`, { left: '36px', top: (30 + i * 92) + 'px', fontSize: '40px' }));
    scenes.push(t => {
      const s0 = W('intro', 3) - .1, p = sp(t - s0, 3, .55);
      seven.style.opacity = t >= s0 ? 1 : 0; seven.style.transform = `scale(${1.2 - .2 * p})`;
      seven.style.color = `rgba(61,255,122,${io(seg(t, s0 + .25, s0 + .7)) * .95})`; seven.style.textShadow = t > s0 ? GLOW : 'none';
      k.f(t, [W('intro', 4) - .05, W('intro', 5) - .05]);
      P.f(t, W('intro', 5) + .2);
      rows.forEach((r, i) => r(t, W('intro', 6) + i * .28, 60));
