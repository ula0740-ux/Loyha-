<script>
/* Avtomobil zavodida stiker-odamchalar badantarbiyasi. Hammasi t dan hisoblanadi (seek(t)).

/* o'lcham: standart 9:16 (1080x1920); ?w=1920&h=1080 — kompyuter ekrani (16:9) */

const ZK = 1;                         // gorizontal kadrda ham shu zoom: keng ekran guruhni va zavodni to'liq sig'diradi
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
Object.assign(document.getElementById('stage').style, { width: W + 'px', height: H + 'px' });
const X = cv.getContext('2d');
const B = window.BEAT, SPB = 60 / B.bpm;
const bpos = t => (t - B.off) / SPB;                       // zarb pozitsiyasi
const barT = k => B.off + (B.down + 4 * k) * SPB;           // k-taktning boshi (1.25 + 2k)
const PI = Math.PI, TAU = 2 * PI;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;

const eio = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };

  [0, 'walk'], [8.25, 'idle'], [11.25, 'spreadReady'], [16.25, 'spread'], [22.75, 'idle'], [34.25, 'run'],
  [51.75, 'idle'], [54.75, 'hipsReady'], [56.25, 'hipsWide'], [62.75, 'neck'], [81.75, 'idle'],

  [141.75, 'idle'], [144.75, 'wide'], [146.75, 'hipsWide'], [153.25, 'waist'], [168.75, 'wide'], [170.75, 'spreadWide'], [176.25, 'twist'],
  [198.25, 'idle'], [202.25, 'wide'], [204.25, 'kneeReady'], [210.75, 'knees'], [225.75, 'idle'], [227.75, 'kneeTReady'], [233.25, 'kneesT'],
  [253.75, 'idle'], [255.75, 'wider'], [257.75, 'lungeReady'], [265.25, 'lunge'], [279.75, 'thanks'], [288.75, 'pump'], [290.25, 'cheer'],

/* har bir ishchining bitta qisqa "xarakter lahzasi" */
const MOMENT = [
  { i: 3, t: 9.25, d: 2.0, k: 'waveHi' },      // keldi — kameraga qo'l silkitadi
  { i: 1, t: 23.25, d: 1.8, k: 'thumb' },      // "Juda ham ajoyib!" — bosh barmoq
  { i: 2, t: 72.25, d: 2.0, k: 'glasses' },    // ko'zoynagini to'g'rilaydi
  { i: 5, t: 82.25, d: 2.2, k: 'wipe' },       // peshonasini artadi
  { i: 0, t: 141.75, d: 2.2, k: 'flex' },      // "Ajoyib!" — kuchini ko'rsatadi
  { i: 4, t: 177.75, d: 1.8, k: 'pump' },      // "ADM!" — musht ko'taradi

/* ======================= POZA ======================= */
const L1 = 120, L2 = 114, UA = 94, FA = 88;          // son, boldir, yelka, bilak (katta yosh proporsiyasi)

function armIK(ox, oy) {

      P.aL = .3 + (L ? -.45 : .45) * up; P.aR = .3 + (L ? .45 : -.45) * up; P.eL = P.eR = -1.45; P.joy = .4; break; }

    case 'neck': // qo'llar belda, bosh o'ngga 4 marta, keyin chapga 4 marta aylanadi

    case 'wide': P.fxL = P.fxR = 28; P.aL = P.aR = .12; break;
    case 'wider': P.fxL = P.fxR = 85; P.aL = P.aR = .2; break;
    case 'shReady': P.fxL = P.fxR = 28; P.aL = P.aR = 1.3; P.eL = P.eR = -2.72; break;
    case 'shoulder': { // qo'llar yelkada: 4 marta oldinga, 4 marta orqaga
      const a = ph * TAU * dir; P.fxL = P.fxR = 28;
      P.aL = P.aR = 1.3 + .42 * Math.sin(a); P.eL = P.eR = -2.72 - .1 * Math.cos(a); P.sh = 10 * Math.cos(a); break; }
    case 'fistReady': P.aL = P.aR = .3; P.eL = P.eR = -1.5; P.foreL = P.foreR = .62; P.fistL = P.fistR = 1; break;
    case 'fist': { // tirsaklar bukilgan, mushtlar 4 marta ichkariga, 4 marta tashqariga aylanadi
      const a = ph * TAU * dir; P.aL = P.aR = .3 + .1 * Math.sin(a); P.eL = P.eR = -1.5 + .42 * Math.cos(a);

    case 'twist': { // qo'llar yoyilgan, gavda o'ngga va chapga buriladi

    case 'knees': { // qo'llar tizzada: tizzalar 4 marta ichkariga, 4 marta tashqariga (ko'zgu aylanalar)
      P.fxL = P.fxR = 28; P.bend = .72; P.squat = .42; P.onKnee = 1;
      const s = 34 * Math.sin(ph * TAU) * dir; P.kxL = s; P.kxR = -s; P.y = 4 * Math.cos(ph * TAU); break; }
    case 'kneeTReady': P.kin = 1; P.fxL = P.fxR = -22; P.bend = .6; P.squat = .62; P.onKnee = 1; break;
    case 'kneesT': { // oyoqlar juft: tizzalar birga o'ngga 4 marta, keyin chapga 4 marta aylanadi
      P.kin = 1; P.fxL = P.fxR = -22; P.bend = .6; P.squat = .62 + .08 * (1 - Math.cos(ph * TAU)) * .5; P.onKnee = 1;

    case 'lungeReady': P.fxL = P.fxR = 85; P.squat = .3; P.bend = .3; P.onKnee = 1; break;
    case 'lunge': { // keng turib, o'ng va chap tizzaga tayanib cho'zilish (har tomonda 4 zarb)
      const f = (lb / 8) % 1, k = f < .5 ? sm(f * 4) * (1 - sm((f - .4) * 10)) : -sm((f - .5) * 4) * (1 - sm((f - .9) * 10));

    case 'cheer': { const f = b - Math.floor(b), c = Math.exp(-f * 7), k = armIK(-64 + 44 * (1 - c), 60 - 60 * c);  // olqish

}
const _ex = exPose;
exPose = function (kind, t, i, t0) {
  const P = _ex(kind, t, i, t0);
  if (kind === 'walk') { const w = walkX(i, t);
    if (w.walking) { const b = bpos(t), n = Math.floor(b), f = b - n, up = Math.sin(f * PI), L = n % 2 === 0;
      P.liftL = L ? .4 * up : 0; P.liftR = L ? 0 : .4 * up; P.y = -8 * up; P.aL = .2 + (L ? -.3 : .3) * up; P.aR = .2 + (L ? .3 : -.3) * up; P.turn = CREW[i].x < 0 ? .6 : -.6; } }
  return P;
};
function segAt(t) { let k = 0; while (k < SEG.length - 1 && t >= SEG[k + 1][0]) k++; return k; }
function blendP(A, Bp, k) { const o = {}; for (const key in A) o[key] = lerp(A[key], Bp[key], k); return o; }
/* yetakchi (oldingi qator markazi) — ko'rsatmalarni aytayotgan murabbiy: og'zi so'zlarga mos ochiladi */
function talkAt(t) { for (const w of WORDS) { if (t < w[1] - .02) return 0; if (t <= w[2]) { const u = (t - w[1]) / Math.max(.12, w[2] - w[1]); return .35 + .55 * Math.abs(Math.sin(u * PI * Math.max(1, Math.round((w[2] - w[1]) / .16)))); } } return 0; }

  if (k > 0 && tb < BL) P = blendP(exPose(SEG[k - 1][1], t, i, SEG[k - 1][0]), P, eio(tb / BL));

    if (m.k === 'thumb') { Q.aR = .95; Q.eR = -2.15; Q.thumbR = 1; Q.fistR = 1; Q.joy = .9; Q.wink = 1; Q.onHip = 0; Q.onKnee = 0; }
    if (m.k === 'glasses') { const h = armIK(22, -100); Q.aR = h.a; Q.eR = h.e; Q.joy = .5; Q.onHip = 0; }

/* ======================= SKELET ======================= */
function rot(x, y, a) { const c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; }

      K = [lerp(K[0], Kl[0], k), lerp(K[1], Kl[1], k)]; Fo = [lerp(F[0], Fl[0], k), lerp(F[1], Fl[1], k)]; }

    R['e' + S] = E; R['w' + S] = [E[0] + v2[0], E[1] + v2[1]];

/* ======================= CHIZISH ======================= */
