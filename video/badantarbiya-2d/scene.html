<title>Badantarbiya 2D</title>

<body><div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>

<script>
/* Avtomobil zavodida stiker-odamchalar badantarbiyasi. Hammasi t dan hisoblanadi (seek(t)).

const W = 1080, H = 1920, cv = document.getElementById('c'), X = cv.getContext('2d');
const B = window.BEAT, SPB = 60 / B.bpm;
const bpos = t => (t - B.off) / SPB;                       // zarb pozitsiyasi
const barT = k => B.off + (B.down + 4 * k) * SPB;           // k-taktning boshi (1.25 + 2k)
const PI = Math.PI, TAU = 2 * PI;

const pulse = (t, d = 6) => { const b = bpos(t), f = b - Math.floor(b); return Math.exp(-f * d); };

/* ======================= PALITRA VA QAHRAMONLAR ======================= */
const C = { tq: '#19c3b5', or: '#ff8a1f', ye: '#ffd23f', co: '#ff6b6b', li: '#9be15d', cb: '#2f5bea', ink: '#1d1b2e', paper: '#fffaf0' };
const SK = ['#f6d0b1', '#e8b48a', '#c98b5e', '#a0673f', '#7a4a2a', '#5a3620'];

  { x: -330, row: 0, suit: C.or, hat: C.cb, skin: SK[2], shoe: C.ye, glove: C.ye, feat: 'beard', hair: '#3a2416' },
  { x: 0, row: 0, suit: C.tq, hat: C.ye, skin: SK[1], shoe: C.co, glove: C.or, feat: 'ponytail', hair: '#2a1a12', lead: 1 },
  { x: 330, row: 0, suit: C.cb, hat: C.or, skin: SK[4], shoe: C.li, glove: C.ye, feat: 'glasses', hair: '#151018' },
  { x: -500, row: 1, suit: C.li, hat: C.co, skin: SK[0], shoe: C.cb, glove: C.or, feat: 'scarf', hair: '#e2557a' },
  { x: -170, row: 1, suit: C.co, hat: C.tq, skin: SK[3], shoe: C.ye, glove: C.li, feat: 'mustache', hair: '#22160f' },
  { x: 170, row: 1, suit: C.ye, hat: C.li, skin: SK[1], shoe: C.tq, glove: C.co, feat: 'bangs', hair: '#6b3b1c' },
  { x: 500, row: 1, suit: '#5b8cff', hat: C.co, skin: SK[5], shoe: C.or, glove: C.ye, feat: 'curly', hair: '#120c0a' },

const ROWY = [0, -120], ROWS = [1, .86];

  [77.25, 'step'], [81.25, 'shoulder'], [97.25, 'squat'], [111.25, 'fist'], [129.25, 'raiseStep'],
  [141.25, 'waist'], [167.25, 'twist'], [193.25, 'breathe'], [197.25, 'knees'], [225.25, 'kneesT'],

];

const MOMENT = [
  { i: 3, t: 9.25, d: 2.2, k: 'waveHi' },     // orqa chap: kameraga qo'l silkitadi
  { i: 1, t: 23.25, d: 2.0, k: 'wink' },      // yetakchi: ko'z qisib, bosh barmoq
  { i: 2, t: 64.75, d: 2.0, k: 'glasses' },   // ko'zoynakni to'g'rilaydi
  { i: 5, t: 77.25, d: 2.0, k: 'spin' },      // aylanib oladi
  { i: 0, t: 141.25, d: 2.4, k: 'flex' },     // muskul ko'rsatadi
  { i: 4, t: 178.25, d: 2.2, k: 'pump' },     // "ADM!" ga musht ko'taradi

/* ======================= POZA ======================= */
const L1 = 105, L2 = 100, UA = 85, FA = 80;          // son, boldir, yelka, bilak

function base() {
  return { y: 0, squat: 0, bend: 0, lean: 0, hipX: 0, tilt: 0, turn: 0, headY: 0, twist: 0, sh: 0,
    aL: .14, eL: -.12, aR: .14, eR: -.12, scL: 1, scR: 1, foreL: 1, foreR: 1, fxL: 0, fxR: 0, liftL: 0, liftR: 0,

/* qo'l IK: elka nuqtasidan nishon (ox — tashqariga, oy — pastga) → {a, e} */

function exPose(kind, t, i, t0) {

      P.aL = P.aR = lerp(.2, 2.85, up); P.eL = P.eR = lerp(-.15, .05, up); P.y = -14 * up - 4 * bt; P.joy = .5 + .4 * up;
      if (kind === 'raiseStep') { const st = Math.sin(((b - B.down) / 4) * PI); P.hipX = 40 * st; P.fxL = 30 - 30 * st; P.fxR = 30 + 30 * st; }
      break; }
    case 'clap': { const f = b - Math.floor(b), c = Math.exp(-f * 7);
      const k = armIK(-58 + 40 * (1 - c), 70 - 60 * c); P.aL = P.aR = k.a + .2 * c; P.eL = P.eR = k.e; P.joy = 1; P.y = -12 * bt; break; }
    case 'run': { // joyida yugurish: har zarbda bitta tizza
      const n = Math.floor(b), f = b - n, up = Math.sin(f * PI), L = n % 2 === 0;
      P.liftL = L ? .9 * up : 0; P.liftR = L ? 0 : .9 * up; P.y = -16 * up;
      P.aL = .35 + (L ? -.5 : .5) * up; P.aR = .35 + (L ? .5 : -.5) * up; P.eL = P.eR = -1.5; P.joy = .7; break; }
    case 'neck': { // qo'llar belda, bosh aylana bo'ylab (2 s = 1 aylana)
      P.onHip = 1; P.tilt = .32 * s4; P.turn = .7 * c4; P.headY = 6 * (1 - Math.abs(s4)) * (c4 > 0 ? 1 : .2); P.y = -3 * bt; P.joy = .45; break; }
    case 'step': { const st = Math.sin(((b - B.down) / 4) * TAU);
      P.hipX = 55 * st; P.fxL = 40 - 40 * st; P.fxR = 40 + 40 * st; P.aL = .3 + .35 * (st * .5 + .5); P.aR = .3 + .35 * (.5 - st * .5); P.y = -8 * bt; P.joy = .8; break; }
    case 'shoulder': { // qo'llar yelkada, yelkalar oldinga-orqaga aylanadi
      const dir = Math.floor((b - 81.25 / SPB) / 16) % 2 ? -1 : 1, a = (ph4 * TAU) * dir;
      P.aL = P.aR = 1.32 + .42 * Math.sin(a); P.eL = P.eR = -2.75 - .1 * Math.cos(a); P.sh = 12 * Math.cos(a); P.y = -4 * bt; P.joy = .5; break; }

      P.aL = P.aR = .32 + .1 * Math.sin(a); P.eL = P.eR = -1.5 + .45 * Math.cos(a); P.foreL = P.foreR = .62 + .2 * Math.sin(a);

    case 'waist': { // bel aylanasi

    case 'twist': { // qo'llar yoyilgan, gavda o'ngga-chapga buriladi
      const k = Math.sin(((b - B.down) / 4) * TAU); P.aL = P.aR = 1.48; P.eL = P.eR = 0;
      P.twist = k; P.scL = 1 - .55 * Math.max(0, k); P.scR = 1 - .55 * Math.max(0, -k); P.turn = .85 * k; P.y = -5 * bt; P.joy = .6; break; }
    case 'knees': case 'kneesT': { // egilib, qo'llar tizzada, tizzalar aylanadi

      P.bend = .75; P.squat = .45; P.onKnee = 1; P.kx = 30 * s4 * dir; P.fxL = P.fxR = T ? -12 : 22; P.y = -3 * bt + 5 * c4;
      P.turn = .15 * s4; P.joy = T ? .7 : .55; break; }
    case 'lunge': { // keng turib, oyoq paylarini cho'zish (o'ng/chap)
      const k = Math.sin(((b - B.down) / 8) * TAU); P.fxL = P.fxR = 95; P.hipX = 75 * k; P.squat = .25 + .3 * Math.abs(k);

    case 'jacks': { // kulminatsiya: "yulduz" sakrash har zarbda, oxirgi taktda katta sakrash
      const f = b - Math.floor(b), up = Math.sin(f * PI), n = Math.floor(b - B.down) % 2, open = n ? 1 - eio(f) : eio(f);
      P.aL = P.aR = lerp(.25, 2.75, open); P.fxL = P.fxR = lerp(0, 70, open); P.y = -38 * up; P.joy = .95;
      const big = (t - 271.25) / 2; if (big > 0 && big < 1) { const j = Math.sin(clamp(big / .85) * PI); P.y = -150 * j; P.squat = .5 * (big > .85 ? 1 - (big - .85) / .15 : 0); P.aL = P.aR = 2.6; P.fxL = P.fxR = 40; }
      break; }
    case 'final': case 'wave': case 'cheer': { // yakuniy poza (har kimniki o'zgacha), keyin xayrlashuv va olqish
      const land = clamp((t - 273.25) / .35), sq = Math.sin(land * PI) * .45;
      const poses = [[2.5, .1, 1.1, -2.4], [2.6, .05, 2.6, .05], [1.7, -.1, 2.9, 0], [2.7, 0, .5, -.2], [2.3, -.3, 2.3, -.3], [.6, -1.9, 2.8, 0], [2.6, 0, 1.5, -.1]];
      const p = poses[i]; P.aL = p[0]; P.eL = p[1]; P.aR = p[2]; P.eR = p[3]; P.squat = sq; P.joy = 1; P.y = -6 * bt;
      if (i === 0) { P.fistL = P.fistR = 1; } if (i === 2) { P.turn = -.5; }
      if (kind === 'wave') { const w = Math.sin(b * PI) ; P.aR = 2.75; P.eR = -.3 + .45 * w; P.aL = .2; P.eL = -.1; P.turn = 0; P.fistL = P.fistR = 0; }
      if (kind === 'cheer') { const f = b - Math.floor(b), c = Math.exp(-f * 7); const k = armIK(-60 + 42 * (1 - c), -40 - 50 * c); P.aL = P.aR = k.a; P.eL = P.eR = k.e; P.y = -10 * bt; P.fistL = P.fistR = 0; P.turn = 0; }

}
function segAt(t) { let k = 0; while (k < SEG.length - 1 && t >= SEG[k + 1][0]) k++; return k; }

    if (m.k === 'wink') { Q.wink = 1; Q.aR = .9; Q.eR = -2.1; Q.thumbR = 1; Q.joy = 1; Q.tilt = .12; }
    if (m.k === 'glasses') { const h = armIK(25, -95); Q.aR = h.a; Q.eR = h.e; Q.fistR = 0; Q.joy = .8; Q.tilt = -.1 * Math.sin(u * 6); Q.onHip = 0; }
    if (m.k === 'spin') { Q.spin = eio(u); Q.aL = Q.aR = 1.2; Q.joy = 1; }
    if (m.k === 'flex') { Q.onHip = 0; Q.aL = Q.aR = 1.55; Q.eL = Q.eR = -2.1 - .15 * Math.sin(u * 18); Q.fistL = Q.fistR = 1; Q.joy = 1; Q.hipX = 0; Q.lean = 0; Q.y -= 6; }

/* ======================= SKELET ======================= */
function rot(x, y, a) { const c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; }

/* ======================= CHIZISH ======================= */

function limb(pts, w, col, pass) {
